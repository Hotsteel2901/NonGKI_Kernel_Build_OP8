name: Build and Release Kernel

permissions:
  contents: write
  actions: write
  # 说明：tag 会指向「含 .github/workflows/ 变更」的 commit。
  # 早期实现用 `git push --tags` 推整条 tag 历史，GitHub 会以
  # "refusing to allow ... without workflows permission" 拒绝。
  # 正确修法是「只推当前 tag」：git push origin refs/tags/$NEW_TAG
  # —— 这样不携带 workflow 文件历史，无需 workflows 权限域。
  # 注意：`workflows` 不是合法的 permissions 作用域，写上会让整个
  # 工作流文件被判为 Invalid workflow file，切勿再加回来。

on:
  workflow_dispatch:
    inputs:
      build-kernel:
        description: 'Build Kernel ?'
        required: true
        type: boolean
        default: true

      release-kernel:
        description: 'Release Kernel ?'
        required: true
        type: boolean
        default: true

      susfs_enable:
        description: '集成 SUSFS (默认开启; 关闭则改用 syscall 手动钩子)'
        required: true
        type: boolean
        default: true

      # ─────────────────────────────────────────────────────────────────────
      # VFS 路径重定向后端（二选一，互斥！）
      # ─────────────────────────────────────────────────────────────────────
      # HybridMount / NoMount 都劫持同一层 VFS，且各自使用
      # 独立不兼容的 keyring 协议，最多只能开一个。这里的值会透传给
      # build-kernel.yml，再传给 build-oneplus-8-los23-a16.yml 做互斥校验。
      vfs_hybridmount:
        description: 'VFS 后端: Hybrid Mount (默认开启)'
        required: true
        type: boolean
        default: true
      vfs_nomount:
        description: 'VFS 后端: NoMount (与 Hybrid Mount 互斥)'
        required: true
        type: boolean
        default: false

jobs:
  build-kernel:
    name: "Step Build Kernel"
    uses: ./.github/workflows/build-kernel.yml
    secrets: inherit
    strategy:
      fail-fast: true
    if: github.event_name == 'workflow_dispatch' && inputs.build-kernel == true
    with:
      susfs_enable: ${{ inputs.susfs_enable }}
      vfs_hybridmount: ${{ inputs.vfs_hybridmount }}
      vfs_nomount: ${{ inputs.vfs_nomount }}

  release-kernel:
    name: "Step Release Kernel"
    runs-on: ubuntu-latest
    needs:
      - build-kernel
    if: github.event_name == 'workflow_dispatch' && inputs.build-kernel == true
    env:
      # 构建 job 实际编译的 commit；拿不到时回退到本 job 的 checkout HEAD。
      BUILD_SHA: ${{ needs.build-kernel.outputs.build_sha }}
      REPO_OWNER: Hotsteel2901
      REPO_NAME: NonGKI_Kernel_Build_OP8
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 包格式：仅用于 release 文案里的「Build info」区块，和实际打包保持一致。
      PACK_METHOD: "Anykernel3"
      # Release 标题格式：管理器（分支名） + 时间，例如 "BakaSU (crdroid) 2026-10-05 10:47"。
      # 本分支面向 crDroid 16.0 内核源码，三段式构建（stage1/2/3）共用同一个 release，
      # 因此标题里不体现 stage，只标分支名 crdroid。
      # 时间由 ${TIME} 在运行时拼接，这里只写前缀部分。
      RELEASE_NAME: "BakaSU (crdroid)"
      RELEASE_NOTES: |
        ### English

        | Device | Codename | Kernel | System | Android | Package | Root | SuSFS | VFS | DroidSpace |
        |----------|----------|----------|----------|----------|----------|----------|----------|----------|----------|
        | OnePlus 8 | instantnoodle | 4.19 (`crdroid-16.0`) | crDroid 16 / LineageOS-based | 16 | AnyKernel3 | BakaSU | v2.3.0 (stage2/3) | Hybrid Mount / NoMount (stage2/3) | ✓ (stage3) |

        **Which file do I need?**

        This branch builds in **three progressive stages** — pick the one that matches what you want:

        | Stage | File suffix | Contains |
        |----------|----------|----------|
        | stage1 | `-stage1-` | BakaSU only (manual/syscall hooks, no SuSFS, no VFS) |
        | stage2 | `-stage2-` | stage1 + SuSFS v2.3.0 + one VFS backend |
        | stage3 | `-stage3-` | stage2 + DroidSpaces (**recommended**) |

        **What is inside (stage3)**

        - **Kernel source**: `crdroidandroid/android_kernel_oneplus_sm8250` @ `16.0`
        - **Root**: BakaSU — pair it with **[BakaSU Manager](https://github.com/Baka-SU/BakaSU/releases)**
        - **SuSFS**: v2.3.0, compiled into the kernel (stage2/stage3)
        - **VFS backend**: **Hybrid Mount** *or* **NoMount** — mutually exclusive, only one is compiled in; printed in the installer title (stage2/stage3)
        - **Extras**: DroidSpaces (stage3). *This branch does **not** include Re:Kernel-X or Baseband Guard.*

        #### Installation

        1. Download the `*.zip` you want (`stage1` / `stage2` / `stage3`) for codename `instantnoodle`.
        2. Reboot into **Recovery** (crDroid Recovery / TWRP / Lineage Recovery).
        3. Choose **Apply update** → **Apply from ADB**, then run:
           ```bash
           adb sideload NonGKI_Kernel_<codename>_<build>.zip
           ```
        4. Reboot to **System**.
        5. Install **[BakaSU Manager](https://github.com/Baka-SU/BakaSU/releases)** and verify root; on stage2/stage3 also check Manager → Settings → SuSFS.

        > **Notes**
        > - This is an **AnyKernel3** package: only the kernel image is replaced, `/data` is untouched.
        > - Back up your stock `boot.img` before flashing so you can roll back.
        > - **Magisk is NOT compatible** with this build — do not flash Magisk on top of it.
        > - First boot may take a few minutes while ART re-optimises apps.

        ---

        ### 中文

        | 设备 | 代号 | 内核 | 系统 | Android | 包格式 | Root | SuSFS | VFS | DroidSpace |
        |----------|----------|----------|----------|----------|----------|----------|----------|----------|----------|
        | OnePlus 8 | instantnoodle | 4.19（`crdroid-16.0`） | crDroid 16 / 基于 LineageOS | 16 | AnyKernel3 | BakaSU | v2.3.0（stage2/3） | Hybrid Mount / NoMount（stage2/3） | ✓（stage3） |

        **该下哪个包？**

        本分支按 **三个渐进阶段** 构建，按需选择：

        | 阶段 | 文件名标识 | 包含内容 |
        |----------|----------|----------|
        | stage1 | `-stage1-` | 仅 BakaSU（手动/syscall 钩子，无 SuSFS、无 VFS） |
        | stage2 | `-stage2-` | stage1 + SuSFS v2.3.0 + 一个 VFS 后端 |
        | stage3 | `-stage3-` | stage2 + DroidSpaces（**推荐**） |

        **包含内容（stage3）**

        - **内核源码**：`crdroidandroid/android_kernel_oneplus_sm8250` @ `16.0`
        - **Root**：BakaSU —— 请搭配 **[BakaSU Manager](https://github.com/Baka-SU/BakaSU/releases)**
        - **SuSFS**：v2.3.0，直接编进内核（stage2/stage3）
        - **VFS 后端**：**Hybrid Mount** 或 **NoMount**，二者互斥，内核里只会编进其中一个，实际以刷机包标题为准（stage2/stage3）
        - **附加组件**：DroidSpaces（stage3）。*本分支**不含** Re:Kernel-X 与 Baseband Guard。*

        #### 安装说明

        1. 下载你需要的 `*.zip`（`stage1` / `stage2` / `stage3`），代号 `instantnoodle`。
        2. 重启进入 **Recovery**（crDroid Recovery / TWRP / Lineage Recovery）。
        3. 选择 **Apply update（应用更新）** → **Apply from ADB（从 ADB 应用）**，然后执行：
           ```bash
           adb sideload NonGKI_Kernel_<代号>_<构建号>.zip
           ```
        4. 重启进入 **系统**。
        5. 安装 **[BakaSU Manager](https://github.com/Baka-SU/BakaSU/releases)** 并确认 root 已生效；stage2/stage3 再检查 管理器 → 设置 → SuSFS。

        > **注意**
        > - 本包为 **AnyKernel3** 格式：仅替换内核镜像，**不会清空** `/data`。
        > - 刷入前请**备份原厂 `boot.img`**，以便回滚。
        > - 本构建**与 Magisk 不兼容**，请勿在其之上再刷 Magisk。
        > - 刷完首次开机可能需要几分钟（ART 重新优化应用）。

    steps:
      # Checkout the code
      # fetch-depth: 0 —— 需要完整历史才能按 SHA 建 tag（部分克隆取不到旧 commit）。
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Download Artifacts for A12 (Only if A12 Build is successful or input is true or empty)
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded-artifacts

      # Get the Latest Tag from GitHub
      - name: Generate and Create New Tag
        run: |
          # 注意：原实现在此拉取 LATEST_TAG，但后续从未使用（死代码），
          # 去重逻辑已改到下面基于 git ls-remote 的冲突递增里，故删除。

          # Get KernelSU version
          git clone -b master https://github.com/backslashxx/KernelSU.git KernelSU-xxksu
          KSU_XXKSU_VERSION=$(cd KernelSU-xxksu && expr $(/usr/bin/git rev-list --count HEAD) + 10200 - 32)
          git clone -b main https://github.com/rsuntk/KernelSU.git KernelSU-rsuntk
          KSU_RSUNTK_VERSION=$(cd KernelSU-rsuntk && expr $(/usr/bin/git rev-list --count HEAD) + 10200)
          git clone -b builtin https://github.com/ShirkNeko/SukiSU-Ultra.git KernelSU-SukiSU-Ultra
          KSU_SUKISU_ULTRA_VERSION=$(cd KernelSU-SukiSU-Ultra && expr $(/usr/bin/git rev-list --count HEAD) + 10200)
          git clone -b legacy https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          KSU_NEXT_VERSION=$(cd KernelSU-Next && expr $(/usr/bin/git rev-list --count HEAD) + 10200)
          # BakaSU（原 ReSukiSU，Baka-SU/BakaSU，原组织已归档）：
          # kernel/Kbuild 的版本公式为 KSU_VERSION = 30000 + KSU_LOCAL_VERSION + 700，
          # 即 base = 30000 + 700 = 30700。
          # 注意：旧写法 base=10200 对应的是 ReSukiSU 时代的 +289 体系，迁移后已失效，切勿沿用。
          git clone -b main https://github.com/Baka-SU/BakaSU.git KernelSU-BakaSU
          KSU_BAKASU_VERSION=$(cd KernelSU-BakaSU && expr $(/usr/bin/git rev-list --count HEAD) + 30700)

          # 本分支实际内置的 root 实现是 BakaSU，tag 里的语义化版本号取它的版本。
          ROOT_VERSION=$KSU_BAKASU_VERSION

          # ---- tag 命名 ----
          # 格式：<分支>-v<管理器版本>-<Unix 时间戳>[ -N ]
          #   例：crdroid_Resuki-v35203-1759601234、...-1759601235-2
          # 旧格式 v<版本>-<时间戳> 有两个问题：
          #   1. 秒级粒度，同一天/同一秒重复触发会撞名；
          #   2. 四个分支共用命名空间，分支间也可能撞名。
          # 加分支前缀解决 2；撞名时递增 -2 / -3 解决 1。
          BRANCH="${GITHUB_REF_NAME:-$(git rev-parse --abbrev-ref HEAD)}"
          BASE_TAG="${BRANCH}-v${ROOT_VERSION}-$(date +%s)"
          NEW_TAG="$BASE_TAG"
          n=1
          while git ls-remote --exit-code --tags origin "refs/tags/$NEW_TAG" >/dev/null 2>&1; do
            n=$((n + 1))
            NEW_TAG="${BASE_TAG}-${n}"
            echo "[!] tag 已存在，尝试: $NEW_TAG"
          done

          echo "[+] New tag: $NEW_TAG"

          TIME=$(date +"%Y-%m-%d %H:%M")
          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV

          # ---- tag 目标 ----
          # 优先指向「本次真正编译的 commit」（build job 透传上来的 SHA），
          # 拿不到才退回当前 checkout HEAD。
          TAG_TARGET="${BUILD_SHA:-$(git rev-parse HEAD)}"
          if ! git cat-file -e "${TAG_TARGET}^{commit}" 2>/dev/null; then
            echo "[!] BUILD_SHA=$TAG_TARGET 本地不存在，回退到 HEAD"
            TAG_TARGET="$(git rev-parse HEAD)"
          fi
          echo "[+] Tag target: $TAG_TARGET"

          git tag "$NEW_TAG" "$TAG_TARGET"

          # ---- 只推当前 tag ----
          # 旧写法 git push --tags 会把本地所有 tag（连同其引用历史）一起推，
          # 一旦其中某个 tag 指向改动过 .github/workflows/ 的 commit，
          # 整个 push 都会被 GitHub 拒绝（workflows 权限校验），
          # release 因此整体失败。改成只推这一个 tag。
          git push origin "refs/tags/$NEW_TAG"

          # Input release note
          # 实际集成的是哪个 VFS 后端：取本次构建的 UI 选择，写进 Build info，
          # 避免用户只能靠刷机包标题猜。
          if [ "${{ inputs.vfs_hybridmount }}" = "true" ]; then
            VFS_LABEL="Hybrid Mount"
          elif [ "${{ inputs.vfs_nomount }}" = "true" ]; then
            VFS_LABEL="NoMount"
          else
            VFS_LABEL="none"
          fi
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$RELEASE_NOTES" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "---" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "**Build info / 构建信息**" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "- Branch / 分支: \`$BRANCH\`" >> $GITHUB_ENV
          echo "- Kernel commit / 内核提交: \`$TAG_TARGET\`" >> $GITHUB_ENV
          echo "- Package format / 包格式: \`$PACK_METHOD\`" >> $GITHUB_ENV
          echo "- VFS backend / VFS 后端: \`$VFS_LABEL\`" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "**Component versions / 组件版本**" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "[KernelSU-xxksu](https://github.com/backslashxx/KernelSU) Version: $KSU_XXKSU_VERSION  " >> $GITHUB_ENV
          echo "[KernelSU-rsuntk](https://github.com/rsuntk/KernelSU) Version: $KSU_RSUNTK_VERSION  " >> $GITHUB_ENV
          echo "[KernelSU-SukiSU-Ultra](https://github.com/ShirkNeko/SukiSU-Ultra) Version: $KSU_SUKISU_ULTRA_VERSION  " >> $GITHUB_ENV
          echo "[KernelSU-Next](https://github.com/KernelSU-Next/KernelSU-Next) Version: $KSU_NEXT_VERSION  " >> $GITHUB_ENV
          echo "[BakaSU](https://github.com/Baka-SU/BakaSU) Version: $KSU_BAKASU_VERSION  " >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # Create GitHub Release and upload files if make_release is true
      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ env.NEW_TAG }}
          prerelease: false
          release_name: "${{ env.RELEASE_NAME }} ${{ env.TIME }}"
          body: ${{ env.RELEASE_NOTES }}

      - name: Upload Release Assets Dynamically
        run: |
          # Loop through all files in the downloaded-artifacts directory
          for file in ./downloaded-artifacts/Kernel-*/*; do
              # Skip directories
              if [ -d "$file" ]; then
                  continue
              fi

              # Upload the file to the GitHub release
              echo "Uploading $file..."
              gh release upload ${{ env.NEW_TAG }} "$file"
          done

      # Display Files Uploaded
      - name: Display Files Uploaded
        run: |
          echo "GitHub release created with the following files:"
          ls ./downloaded-artifacts/**/*

