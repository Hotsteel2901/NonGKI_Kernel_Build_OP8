name: Build Oneplus 8 (Tropsi-X Kernel A16) (BakaSU+SUSFS Kernel)

# ============================================================================
# 可复用构建工作流（OnePlus 8 / Tropsi-X Kernel / Android 16）
#
# 由 build-kernel.yml 通过 workflow_call 调用，3 个 VFS 后端开关以
# inputs.* 传入（UI 控件定义在 build-kernel.yml / build-release.yml）。
# 这里同时声明 workflow_dispatch 直触发时所需的同默认值，保证两种入口
# 行为一致；真正生效的读取在下方 Validate 步骤里（inputs.* 优先）。
# ============================================================================
on:
  workflow_call:
    inputs:
      susfs_enable:
        description: '集成 SUSFS (默认开启; 关闭则改用 syscall 手动钩子)'
        required: false
        type: boolean
        default: true
      susfs_lkm:
        description: 'SUSFS 方式: true=外置 LKM (susfs_guard_lkm.ko), false=in-tree 内置'
        required: false
        type: boolean
        default: false
      vfs_hybridmount:
        description: 'VFS 后端: Hybrid Mount (默认开启)'
        required: false
        type: boolean
        default: true
      vfs_nomount:
        description: 'VFS 后端: NoMount (与 Hybrid Mount 互斥)'
        required: false
        type: boolean
        default: false
    # 把「实际参与编译的内核 commit」向上暴露给 build-kernel / build-release，
    # 让 release tag 能精确打在这个 commit 上，而不是 release job 自己
    # checkout 出来的 HEAD（两者的 commit 在并发/后续提交场景下可能不同）。
    outputs:
      build_sha:
        description: '本次内核实际构建所用的 commit SHA'
        value: ${{ jobs.build-kernel.outputs.build_sha }}
  workflow_dispatch:
    inputs:
      susfs_enable:
        description: '集成 SUSFS (默认开启; 关闭则改用 syscall 手动钩子)'
        required: true
        type: boolean
        default: true
      susfs_lkm:
        description: 'SUSFS 方式: true=外置 LKM (susfs_guard_lkm.ko), false=in-tree 内置'
        required: true
        type: boolean
        default: false
      vfs_hybridmount:
        description: 'VFS 后端: Hybrid Mount (默认开启)'
        required: true
        type: boolean
        default: true
      vfs_nomount:
        description: 'VFS 后端: NoMount (与 Hybrid Mount 互斥)'
        required: true
        type: boolean
        default: false

env:
  # Device env
  DEVICE_NAME : "oneplus_8"
  DEVICE_CODENAME : "instantnoodle"

  # AK3 刷机包在 recovery 里显示的标题行。
  # 格式: 管理器（分支名） + 集成内容 Built By hotsteel
  # VFS 段由下方 build 步骤按实际启用的后端动态拼进 AK3_TITLE，
  # 这里只给静态部分（不含 VFS），避免标题与实际集成内容不一致。
  # 注意: 不要在此定义 AK3_TITLE —— workflow 级 env 会覆盖 GITHUB_ENV 里的
  # 运行时值，导致动态组装的标题失效。AK3_TITLE 由 Validate 步骤写入。
  AK3_TITLE_PREFIX: "BakaSU (TropsPK) + SUSFS v2.4.0"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  # Tropsi-X（OOS stock 衍生）保留了大量 OPPO/QTI 老式 C 代码，而 clang 19 对
  # 这些写法新增/收紧了大量告警，配合树里自带的 -Werror（顶层 Makefile
  # 1041-1053 行的 -Werror=implicit-int / strict-prototypes / date-time /
  # incompatible-pointer-types / designated-init，以及
  # drivers/vservices/Makefile、oplus/kernel_4.19/audio/codecs/tfa98xx-v6/Kbuild
  # 里的裸 -Werror）会成片变成编译错误。
  # 这里按**类别**降级（-Wno-error=X 对之后的 -Werror 同样有效，已实测），
  # 告警照常打印，只是不再中断构建；其余错误保持原样。
  EXTRA_CMDS : "KCFLAGS='-Wno-error=strict-prototypes -Wno-error=implicit-int -Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types -Wno-error=incompatible-pointer-types-discards-qualifiers -Wno-error=int-conversion -Wno-error=unused-but-set-variable -Wno-error=unused-variable -Wno-error=unused-function -Wno-error=unused-const-variable -Wno-error=misleading-indentation -Wno-error=uninitialized -Wno-error=format -Wno-error=address -Wno-error=array-bounds -Wno-error=enum-conversion -Wno-error=constant-conversion -Wno-error=literal-conversion -Wno-error=date-time -Wno-error=return-type -Wno-error=sizeof-pointer-memaccess -Wno-error=tautological-pointer-compare -Wno-error=shift-negative-value'"

  # Tropsi-X 内核（TropsPk）：4.19.157 / SM8250(kona)，一套代码覆盖
  # OnePlus 8 (19811) / 8 Pro (19805) / 8T (19821) / 9R (19855)。
  # 该树是 OOS stock 树衍生物：顶层 Makefile `-include OplusKernelEnvConfig.mk`
  # 会 export BRAND_SHOW_FLAG=oneplus，dts Makefile 才会编 19811 等 oneplus
  # project（否则落到 else 分支编别的机型），这一点不能动。
  KERNEL_SOURCE : "https://github.com/TropsPk/Tropsi_X_Kernel_SM8250.git"
  KERNEL_BRANCH : "Staging"

  CLANG_SOURCE : "https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/LLVM-19.1.7-Linux-X64.tar.xz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/kona-perf_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  # 保持 latest: 每次构建都会通过 BakaSU setup.sh (git pull) 拉取最新 main 分支
  KERNELSU_AUTO_GET : "true" # if u want easy setting kernelsu, u can true.
  # 注意: "resukisu" 只是内部标识符(下游有多处分支判断, 改动无收益), 实际仓库指向
  # Baka-SU/BakaSU, 拼出的 setup.sh 地址为:
  #   https://raw.githubusercontent.com/Baka-SU/BakaSU/refs/heads/main/kernel/setup.sh
  KERNELSU_AUTO_FORK : "resukisu" # xxksu, rsuntk, next, resukisu and sukisu

  # SUSFS 由 UI 勾选控制（workflow_dispatch / workflow_call 的 susfs_enable 输入），
  # 默认开启。关闭时：不应用 SUSFS 补丁，改用 Patches/syscall_hook_patches.sh
  # 的手动（syscall）钩子，保证 KernelSU 仍可用。
  # 注意: 直接用 inputs 表达式，而不是在运行时写 GITHUB_ENV —— 因为 workflow 级
  # env 会覆盖 GITHUB_ENV 的运行时值（见 AK3_TITLE 的说明）。
  # SUSFS 主开关（susfs_enable）分两种方式：
  #   - built-in（susfs_lkm=false，默认）：打 in-tree SUSFS 补丁 + KernelSU 内联钩子；
  #     并在 KernelSU 侧“解锁” BakaSU 的 suspend（48fa4bb 的 $(error)，见下）。
  #   - LKM（susfs_lkm=true）：不打 in-tree SUSFS，改用 syscall 手动钩子；另外编译
  #     外置 susfs_guard_lkm.ko 并打包成 KernelSU 模块（susfs-lkm-module.zip）。
  # SUSFS_ENABLE 沿用旧语义（=“是否用 in-tree 内置 SUSFS”），下游所有 == "true" 判断无需改。
  SUSFS_ENABLE : ${{ inputs.susfs_enable && !inputs.susfs_lkm }}
  SUSFS_LKM : ${{ inputs.susfs_enable && inputs.susfs_lkm }}
  SUSFS_FIXED : false

  # 外置 SUSFS-LKM 源码（legacy 分支面向 pre-5.10；4.19 适配见 Patches/SUSFS-LKM/）
  SUSFS_LKM_SOURCE : "https://github.com/Hotsteel2901/susfs4ksu-lkm.git"
  SUSFS_LKM_REF : "legacy"

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "tropsi_a16"

  # Other env
  PYTHON_VERSION: "3"

  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"

  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""

  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  # Tropsi-X 内核自带 OPLUS HANS（kona-perf 与 oplus-stock 两份 defconfig
  # 都有 CONFIG_OPLUS_HANS=y），且 NoActive 会自动 hook 到 HANS 上，
  # 因此本分支**不再集成 Re:Kernel-X**（rkx 的 binder 异步事务清理与之功能重叠，
  # 叠加反而可能互相干扰）。
  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "true"

  # ─────────────────────────────────────────────────────────────────────────
  # VFS 路径重定向后端（二选一，互斥！）
  # ─────────────────────────────────────────────────────────────────────────
  # 这三个都工作在同一个内核层（劫持 inode_operations / file_operations /
  # dentry_operations），并各自使用**独立且不兼容的 keyring 协议**
  # （HybridMount 用 "hm1" / NoMount 用 "NOMOUNT"）。
  # 上游 Hybrid Mount 的 Kconfig 里就明确写了：
  #   "not compatible with NoMount's metametamodule or its tooling"
  # 同时开启会让两套驱动抢同一层 hook，轻则元模块认不到内核、重则崩溃。
  # 因此**最多只能开一个**，构建开头有互斥校验，开了多个直接 fail。
  #
  # 默认值仅作 workflow_call 未传参时的兜底：真正生效的值来自
  # inputs.vfs_*（UI 定义在 build-kernel.yml / build-release.yml）。
  # Validate 步骤用 ${VFS_HYBRIDMOUNT:-true} 这种 shell 默认值兜底，
  # 因此这里保留同名 env 是安全的（不会被当默认来源误用）。
  #
  # 默认: HybridMount 开, 其余关（HybridMount 是本仓库长期验证过的组合）。
  VFS_HYBRIDMOUNT: "true"  # Hybrid Mount VFS 后端 (fs/hybridmount, 4.19 内置移植)
  VFS_NOMOUNT: "false"     # NoMount VFS 后端 (fs/nomount, 上游 setup.sh 集成)

  HOOK_METHOD: "syscall" # Manual hook method -> syscall.

  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: ""

  BASEBAND_GUARD_ENABLE: "true"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false" # if u kernel need DTB , but cannot auto generate it. (Only Anykernel3).
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  # Tropsi-X 自带完整 kona-perf_defconfig（含全量 OPLUS_FEATURE_* 与驱动），
  # 仓库里**没有** vendor/oplus.config，强行 merge 会因文件不存在失败。
  # 因此关闭额外 merge，直接用 defconfig 本身；DroidSpaces 仍在 build-process
  # 里单独 merge 自己的 droidspaces.config，不受影响。
  BUILD_OTHER_CONFIG: "false" # Merge config files.
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Oneplus 8 (Tropsi-X Kernel A16) (BakaSU+SUSFS Kernel)
    runs-on: ubuntu-latest
    outputs:
      build_sha: ${{ steps.build_sha.outputs.build_sha }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🧭 Validate VFS backend selection (mutually exclusive)
        run: |
          # HybridMount / NoMount 二者互斥：它们都劫持同一层 VFS
          # (inode_operations / file_operations / dentry_operations)，且各自使用
          # 独立不兼容的 keyring 协议。同时启用会导致两套驱动抢同一批 hook，
          # 元模块无法正确握手（认不到内核），严重时直接崩溃。
          # 这里做前置校验，开了多个就立刻 fail，避免产出一个坏内核。
          #
          # 开关来源: inputs.vfs_*（UI 定义在 build-kernel.yml /
          # build-release.yml，这里只负责接收与校验）。
          # 用 ${VAR:-默认值} 兜底，防止 workflow_call 未传参时变量为空
          # 而被当成 "false" 处理。
          HM="${{ inputs.vfs_hybridmount }}"
          NM="${{ inputs.vfs_nomount }}"
          HM="${HM:-true}"
          NM="${NM:-false}"

          COUNT=0
          [ "$HM" = "true" ] && COUNT=$((COUNT + 1))
          [ "$NM" = "true" ] && COUNT=$((COUNT + 1))

          echo "VFS backend selection:"
          echo "  VFS_HYBRIDMOUNT = $HM"
          echo "  VFS_NOMOUNT     = $NM"

          if [ "$COUNT" -gt 1 ]; then
            echo ""
            echo "[-] ERROR: VFS backends are mutually exclusive, but $COUNT are enabled."
            echo "[-] HybridMount / NoMount both hijack the same VFS layer and"
            echo "[-] use incompatible keyring protocols. Enable at most ONE of them."
            exit 1
          fi

          if [ "$COUNT" -eq 0 ]; then
            echo "[i] No VFS backend selected — building without path redirection."
          else
            echo "[+] VFS backend check passed."
          fi

          # 组装 AK3 标题：只在真正启用某个 VFS 后端时才把对应名字写进去，
          # 保证标题与内核实际集成内容一致（不会出现写着 Hybrid Mount
          # 实际装的是 NoMount 的情况）。写入 $GITHUB_ENV 供后续打包步骤读取。
          VFS_LABEL=""
          if [ "$HM" = "true" ]; then VFS_LABEL="Hybrid Mount VFS"; fi
          if [ "$NM" = "true" ]; then VFS_LABEL="NoMount VFS"; fi

          # 集成项也按开关拼，避免标题写着 ReKernel-X 但实际没编进去。
          EXTRA_LABEL=""
          if [ "${{ env.REKERNEL_ENABLE }}" = "true" ]; then EXTRA_LABEL="$EXTRA_LABEL + ReKernel-X"; fi
          if [ "${{ env.DROIDSPACES_ENABLE }}" = "true" ]; then EXTRA_LABEL="$EXTRA_LABEL + DroidSpaces"; fi
          if [ "${{ env.BASEBAND_GUARD_ENABLE }}" = "true" ]; then EXTRA_LABEL="$EXTRA_LABEL + Baseband Guard"; fi

          TITLE="${{ env.AK3_TITLE_PREFIX }}"
          if [ -n "$VFS_LABEL" ]; then
            TITLE="$TITLE + $VFS_LABEL"
          fi
          TITLE="$TITLE$EXTRA_LABEL Built By hotsteel"

          echo "AK3_TITLE=$TITLE" >> $GITHUB_ENV
          echo "[+] AK3 title will be: $TITLE"

      - name: 📌 Use latest kernel source (no pinned checkout)
        id: build_sha
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          grep -q "kernelsu" drivers/Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
          grep -q "source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig || sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig
          # 记录本次实际参与编译的内核 commit，向上透传给 release 的 tag 步骤。
          echo "build_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "[+] Build SHA: $(git rev-parse HEAD)"
          echo "-g$(git rev-parse --short HEAD)-hotsteel" > .scmversion

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch KernelSU Hooks (SUSFS inline / syscall fallback)
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/
          # env.SUSFS_ENABLE = susfs_enable && !susfs_lkm：即“in-tree 内置 SUSFS”。
          # susfs_lkm=true 时走下面的 else（syscall 钩子），SUSFS 由外置 LKM 提供。
          if [ "${{ env.SUSFS_ENABLE }}" = "true" ]; then
            # SUSFS 开启：BakaSU 官方 SUSFS inline 模式的内联钩子
            # (#ifdef CONFIG_KSU_SUSFS 门控)
            # Tropsi-X 的 drivers/input/input.c 在 input_handle_event() 里
            # 多了 OPLUS_FEATURE_SAUPWK 的弱符号调用，原补丁的上下文匹配不上，
            # 用本分支专用版本（差异仅 input.c 一处 hunk）。
            KSU_HOOK_PATCH="resukisu_inline_hooks.patch"
            if [ -f "/tmp/Patches/Patch/resukisu_inline_hooks_trop.patch" ]; then
              KSU_HOOK_PATCH="resukisu_inline_hooks_trop.patch"
            fi
            cp "/tmp/Patches/Patch/$KSU_HOOK_PATCH" ./
            patch -p1 < "$KSU_HOOK_PATCH" || { echo "::error::$KSU_HOOK_PATCH failed to apply"; exit 1; }
            rm -f "$KSU_HOOK_PATCH"
            echo "[+] BakaSU SUSFS inline hooks patched."

            # 解锁 BakaSU 对 in-tree SUSFS 的 suspend（commit 48fa4bb，2026-10）：
            #   kernel/tools/susfs_compat.mk 里加了无条件 `$(error Please wait susfs update.)`，
            #   只要 CONFIG_KSU_SUSFS=y 就 kbuild 直接炸。这里删掉该 error 行（保留 info），
            #   让 in-tree SUSFS 能编。⚠️ BakaSU 这么说是因为 SUSFS 尚未同步最新 KernelSU，
            #   有 selinux_hide 被检测的风险 —— 用户显式选 built-in 即视为接受。
            if [ -f drivers/kernelsu/tools/susfs_compat.mk ]; then
              cp drivers/kernelsu/tools/susfs_compat.mk /tmp/susfs_compat.mk.bak
              sed -i '/Please wait susfs update/d' drivers/kernelsu/tools/susfs_compat.mk
              if grep -qE '^\$\(error' drivers/kernelsu/tools/susfs_compat.mk; then
                echo "[-] failed to unblock BakaSU susfs suspend in susfs_compat.mk"
                echo "[-] --- susfs_compat.mk ---"; cat drivers/kernelsu/tools/susfs_compat.mk
                false
              fi
              echo "[+] BakaSU in-tree SUSFS unblocked (removed the \$(error) suspend)."
            else
              echo "[i] drivers/kernelsu/tools/susfs_compat.mk not present (not a BakaSU tree?) - skip unblock."
            fi
          else
            # SUSFS 关闭（或走外置 LKM）：改用 syscall（手动）钩子回退，KernelSU 以
            # CONFIG_KSU_MANUAL_HOOK 模式工作（build-ready 已写入该开关）。
            # 脚本来自上游 JackA1ltman/NonGKI_Kernel_Build_2nd。
            cp /tmp/Patches/syscall_hook_patches.sh ./
            bash syscall_hook_patches.sh ./
            rm -f syscall_hook_patches.sh
            echo "[+] KernelSU syscall hooks patched (in-tree SUSFS disabled)."
          fi

      - name: 🏷️ Strip "-dirty" from KernelSU version string
        run: |
          # BakaSU 的 kernel/Kbuild 用下面这段判断工作区是否干净：
          #   ifneq ($(shell cd $(KSU_SRC); git diff-index --quiet HEAD; echo $$?),0)
          #   KSU_COMMIT_SHA := $(KSU_COMMIT_SHA)-dirty
          #   endif
          # 我们的流程是「clone BakaSU -> symlink 进内核树 -> 打 inline hooks /
          # 删 susfs_compat.mk 的 $(error)」，因此 git 必然判定为 dirty，
          # 管理器里就会显示 "v4.2.0-rc3-xxxxxxxx-dirty"，观感很差。
          #
          # 这里只删掉这段**纯显示层**的判断：版本码 KSU_VERSION 由
          # `git rev-list --count HEAD` 派生，完全不受影响；内核侧功能、
          # SUSFS/钩子逻辑也不读 KSU_COMMIT_SHA。删掉后版本串变成
          # "v4.2.0-rc3-xxxxxxxx"，与管理器版本仍能正常对应。
          #
          # 兼容性：Kbuild 若改版（找不到这三行连续结构）就跳过，不报错，
          # 最差结果只是继续显示 -dirty，绝不会让构建失败。
          KSU_KBUILD="$GITHUB_WORKSPACE/device_kernel/drivers/kernelsu/Kbuild"
          if [ ! -f "$KSU_KBUILD" ]; then
            echo "[i] $KSU_KBUILD not found (no KernelSU in this build) - skip."
            exit 0
          fi

          LINE=$(grep -n 'KSU_COMMIT_SHA  := \$(KSU_COMMIT_SHA)-dirty' "$KSU_KBUILD" | cut -d: -f1 | head -1)
          if [ -z "$LINE" ]; then
            echo "[i] -dirty marker not found (already clean / upstream changed) - skip."
            exit 0
          fi

          PREV=$(sed -n "$((LINE - 1))p" "$KSU_KBUILD")
          NEXT=$(sed -n "$((LINE + 1))p" "$KSU_KBUILD")
          if ! printf '%s' "$PREV" | grep -q 'diff-index --quiet HEAD'; then
            echo "[-] unexpected Kbuild layout: previous line is not the diff-index check."
            echo "    prev: $PREV"
            echo "[i] leave Kbuild untouched."
            exit 0
          fi
          if [ "$(printf '%s' "$NEXT" | tr -d '[:space:]')" != "endif" ]; then
            echo "[-] unexpected Kbuild layout: next line is not 'endif'."
            echo "    next: $NEXT"
            echo "[i] leave Kbuild untouched."
            exit 0
          fi

          sed -i "$((LINE - 1)),$((LINE + 1))d" "$KSU_KBUILD"
          echo "[+] Stripped -dirty from BakaSU version string (KSU_VERSION unchanged)."
          grep -n "KSU_COMMIT_SHA" "$KSU_KBUILD" || true

      - name: 🧩 Patch Hybrid Mount VFS Subsystem
        if: inputs.vfs_hybridmount == true
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/

          # Hybrid Mount 的 VFS 后端不是内核通用 VFS，而是它自己的 hybridmount 子系统
          # （fork 自 NoMount，通过 keyring 驱动）。它只提供 5.10/5.15/6.1/6.6/6.12 的
          # 预编译 .ko，4.19 一个候选都匹配不到，所以必须 built-in 集成。
          # 本子系统与 SUSFS / BakaSU 完全解耦（不引用任何 ksu_/susfs_ 符号），
          # 与 SUSFS 补丁仅在 fs/Makefile 尾部追加处有交集，补丁顺序对结果无影响。
          #
          # Trop 的 Tropsi-X 树里 fs/Makefile 尾部是 OPLUS 的
          # `ifeq ($(CONFIG_OPLUS_FEATURE_EROFS),y)` + exfat 块，没有裸的
          # `obj-$(CONFIG_EROFS_FS) += erofs/` 行，通用补丁的上下文匹配不上，
          # 因此单独准备了一份把追加点挪到文件末尾的 *_trop.patch。
          HM_PATCH="hybridmount_patch_to_4.19.patch"
          if [ -f "/tmp/Patches/Patch/hybridmount_patch_to_4.19_trop.patch" ]; then
            HM_PATCH="hybridmount_patch_to_4.19_trop.patch"
          fi
          echo "[+] Using $HM_PATCH"
          cp "/tmp/Patches/Patch/$HM_PATCH" ./
          patch -p1 < "$HM_PATCH" || true
          rm -f "$HM_PATCH"

          # patch -p1 加了 || true，若真有 hunk 打不上这里必须报出来
          if [ -n "$(find . -name '*.rej')" ]; then
            echo "[-] hybridmount_patch has rejected hunks!"
            find . -name "*.rej" -exec cat {} \;
            false
          fi

          # 集成结果自检
          test -f fs/hybridmount/hybridmount.c || { echo "[-] fs/hybridmount/hybridmount.c missing"; false; }
          grep -qF 'obj-$(CONFIG_HYBRIDMOUNT) += hybridmount/' fs/Makefile || { echo "[-] fs/Makefile not wired"; false; }
          grep -qF 'source "fs/hybridmount/Kconfig"' fs/Kconfig || { echo "[-] fs/Kconfig not wired"; false; }
          echo "[+] Hybrid Mount VFS subsystem patched (built-in)."

      - name: ⚙️ Enable Hybrid Mount VFS in DEFCONFIG
        if: inputs.vfs_hybridmount == true
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          DEFCONFIG_PATH="./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"

          # CONFIG_KEYS=y 是 hybridmount 的硬依赖（它要 register_key_type）。
          # kona-perf_defconfig 里没有这一行，目前是靠 CONFIG_FS_ENCRYPTION=y
          # 在 fs/crypto/Kconfig 里 'select KEYS' 传递选中的。显式写出来，
          # 免得将来有人关掉 FS_ENCRYPTION 时把 keyring 一起带走。
          # 注意：只加 CONFIG_KEYS=y 不够，KEYS 还 select ASSOCIATIVE_ARRAY。
          sed -i '/^CONFIG_KEYS=/d' "$DEFCONFIG_PATH"
          sed -i '/^CONFIG_ASSOCIATIVE_ARRAY=/d' "$DEFCONFIG_PATH"
          echo "CONFIG_KEYS=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_ASSOCIATIVE_ARRAY=y" >> "$DEFCONFIG_PATH"

          # =y 而不是 =m：4.19 没有对应的预编译 .ko，内置进内核镜像才生效。
          # 先删掉可能存在的旧行，避免重复定义。
          sed -i '/^CONFIG_HYBRIDMOUNT=/d' "$DEFCONFIG_PATH"
          echo "CONFIG_HYBRIDMOUNT=y" >> "$DEFCONFIG_PATH"

          echo "[+] Appended to ${DEFCONFIG_PATH}:"
          grep -nE "CONFIG_(HYBRIDMOUNT|KEYS|ASSOCIATIVE_ARRAY)=" "$DEFCONFIG_PATH"

      - name: 🕳️ Patch NoMount VFS Subsystem
        if: inputs.vfs_nomount == true
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/

          # NoMount 与 HybridMount 是同源不同家的方案：HybridMount 的 hybridmount
          # 子系统就是从 NoMount fork 出来的，但**重命名了符号、换了自己的 wire magic**
          # （HybridMount 用 "HYBRIDMO"），因此两套元模块与工具链互不通用。
          # 二者只能选一个，构建开头的互斥校验会拦截同时开启的情况。
          #
          # NoMount 官方仓库自带 kernel/setup.sh，做的是通用内核集成：
          #   1) git clone 到内核树内的 NoMount/（内部 checkout dev，git pull 更新）
          #   2) 在 fs/ 下建 symlink  fs/nomount -> ../NoMount/kernel/src
          #   3) 往 fs/Makefile 追加 obj-$(CONFIG_NOMOUNT) += nomount/
          #   4) 在 fs/Kconfig 的**最后一个** endmenu 前插入 source "fs/nomount/Kconfig"
          # 不依赖具体内核版本 —— 上游文档说明 4.19 这类 legacy 内核无法用
          # 预编译 .ko，必须源码集成，这个脚本正是干这个的。
          # 集成方式与上游 JackA1ltman/NonGKI_Kernel_Build_2nd 的 patch-nomount 一致。
          #
          # 注意（2026-11 上游变更）：源码目录从 kernel/ 下移到 kernel/src/，
          # setup.sh 同时自己完成 Makefile/Kconfig 接线；下面的自检按新布局校验。
          curl -sSL "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" | bash -s

          # setup.sh 的失败不一定反映到管道的退出码（curl | bash 只取 bash 的），
          # 所以这里做集成结果自检。
          test -L fs/nomount || { echo "[-] fs/nomount is not a symlink (setup.sh did not run?)"; false; }
          test -f fs/nomount/nomount.c || { echo "[-] fs/nomount/nomount.c missing"; false; }
          test -f fs/nomount/Kconfig || { echo "[-] fs/nomount/Kconfig missing"; false; }
          grep -q "nomount" fs/Makefile || { echo "[-] fs/Makefile not wired"; false; }
          grep -q "fs/nomount/Kconfig" fs/Kconfig || { echo "[-] fs/Kconfig not wired"; false; }
          echo "[+] NoMount VFS subsystem patched (built-in, $(readlink fs/nomount))."

      - name: ⚙️ Enable NoMount VFS in DEFCONFIG
        if: inputs.vfs_nomount == true
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          DEFCONFIG_PATH="./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"

          # CONFIG_KEYS / CONFIG_ASSOCIATIVE_ARRAY 同样是 NoMount 的硬依赖：
          # 它与 userspace 的 nm 二进制之间完全靠 Linux keyring 通信
          # （add_key），不依赖 /dev 节点与 ioctl。
          sed -i '/^CONFIG_KEYS=/d' "$DEFCONFIG_PATH"
          sed -i '/^CONFIG_ASSOCIATIVE_ARRAY=/d' "$DEFCONFIG_PATH"
          echo "CONFIG_KEYS=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_ASSOCIATIVE_ARRAY=y" >> "$DEFCONFIG_PATH"

          # NoMount 是 drop-in 内核子系统，同样必须 =y 内置（4.19 无预编译 .ko）。
          sed -i '/^CONFIG_NOMOUNT=/d' "$DEFCONFIG_PATH"
          echo "CONFIG_NOMOUNT=y" >> "$DEFCONFIG_PATH"

          echo "[+] Appended to ${DEFCONFIG_PATH}:"
          grep -nE "CONFIG_(NOMOUNT|KEYS|ASSOCIATIVE_ARRAY)=" "$DEFCONFIG_PATH"

      - name: ⚙️ Enable SUSFS-LKM deps in DEFCONFIG (LKM mode)
        if: env.SUSFS_LKM == 'true'
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          DEFCONFIG_PATH="./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"

          # 外置 SUSFS-LKM 的硬依赖：
          #   - KPROBES/KRETPROBES：dirent 过滤与自身符号自举；
          #   - KALLSYMS_ALL：ksud insmod 从 /proc/kallsyms 绝对化未定义符号；
          #   - MODULES/MODULE_UNLOAD：可加载 + rmmod。
          # 这些在 kona-perf_defconfig 里默认没有，显式打开。
          for k in MODULES MODULE_UNLOAD KALLSYMS KALLSYMS_ALL KPROBES KRETPROBES; do
            sed -i "/^CONFIG_${k}=/d" "$DEFCONFIG_PATH"
            echo "CONFIG_${k}=y" >> "$DEFCONFIG_PATH"
          done

          echo "[+] SUSFS-LKM deps appended to ${DEFCONFIG_PATH}:"
          grep -nE "CONFIG_(MODULES|MODULE_UNLOAD|KALLSYMS|KALLSYMS_ALL|KPROBES|KRETPROBES)=" "$DEFCONFIG_PATH"

      - name: 🪛 Extra Kernel Options
        run: |
          # Only ${{ env.DEVICE_NAME }} use it.
          cd $GITHUB_WORKSPACE/device_kernel

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🧬 Build SUSFS-LKM (susfs_guard_lkm.ko) [LKM mode]
        if: env.SUSFS_LKM == 'true'
        run: |
          git clone --depth=1 --single-branch -b "$SUSFS_LKM_REF" "$SUSFS_LKM_SOURCE" susfs_lkm
          cd susfs_lkm
          echo "SUSFS-LKM HEAD: $(git rev-parse HEAD) ($SUSFS_LKM_REF)"
          # 注意：build-env 里执行过 `mv $GITHUB_WORKSPACE/Patches /tmp/`，
          # 所以这里必须用 /tmp/Patches/...（工作流其它步骤同理）。
          shopt -s nullglob
          for p in /tmp/Patches/SUSFS-LKM/*.patch; do
            echo "[+] applying $(basename "$p")"
            patch -p1 < "$p" || { echo "::error::$(basename "$p") failed to apply"; exit 1; }
          done
          if [ "$(ls -1 /tmp/Patches/SUSFS-LKM/*.patch 2>/dev/null | wc -l)" -eq 0 ]; then
            echo "::error::no SUSFS-LKM patches found in /tmp/Patches/SUSFS-LKM/"; exit 1
          fi
          if [ -n "$(find . -name '*.rej')" ]; then
            echo "::error::SUSFS-LKM patches left .rej files:"; find . -name '*.rej'; exit 1
          fi

          cd kernel
          # 外置构建，针对同一个已构建的内核树（out/ 里已有 vmlinux + Module.symvers）。
          # 未定义符号由 ksud insmod 在真机上从 /proc/kallsyms 解析。
          #
          # ⚠️ 必须像内核构建那样导出交叉工具链（build-process 里 `export "$GCC_64"`），
          # 否则模块 relocatable-link 会用宿主 x86_64 的 ld 而失败：
          #   "ld: unrecognised emulation mode: aarch64linux"
          # GCC_64/32 形如 "CROSS_COMPILE=aarch64-...-"，由 build-env 写进 $GITHUB_ENV。
          [ -n "$GCC_64" ] && export "$GCC_64"
          [ -n "$GCC_32" ] && export "$GCC_32"
          echo "[i] CROSS_COMPILE=${CROSS_COMPILE:-<unset>}"
          set +e; set -o pipefail
          # NonGKI 内核默认带 -Werror：SUSFS-LKM 只在无 -Werror 下验证过，
          # 这里 KCFLAGS 追加 -Wno-error 把新告警降级（真正的 error 仍会中止）。
          make -C "$GITHUB_WORKSPACE/device_kernel" O="$GITHUB_WORKSPACE/device_kernel/out" M="$PWD" \
            CC=clang ARCH="${{ env.KERNEL_ARCH }}" ${{ env.CUSTOM_CMDS }} KCFLAGS="-Wno-error" \
            -j"$(nproc --all)" modules 2>&1 | tee /tmp/susfs_build.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::SUSFS-LKM build failed (rc=$rc) — see Patches/SUSFS-LKM/README.md"
            grep -nE 'error:|fatal error:|Error [0-9]|undefined reference|No such file|No rule to make|implicit declaration' /tmp/susfs_build.log | tail -30 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          ls -la susfs_guard_lkm.ko

      - name: 📦 Package SUSFS-LKM KernelSU module [LKM mode]
        if: env.SUSFS_LKM == 'true'
        run: |
          # SUSFS 是外置运行时模块，不会被编进内核；打成 KernelSU 模块 zip，
          # 在管理器里装一次即可开机自动 `ksud insmod`（见 susfs-module/README.md）。
          rm -rf mod_stage
          mkdir -p mod_stage
          cp "$GITHUB_WORKSPACE"/susfs-module/module.prop mod_stage/
          cp "$GITHUB_WORKSPACE"/susfs-module/post-fs-data.sh mod_stage/
          cp "$GITHUB_WORKSPACE"/susfs-module/service.sh mod_stage/
          cp susfs_lkm/kernel/susfs_guard_lkm.ko mod_stage/
          chmod 755 mod_stage/*.sh
          rm -f susfs-lkm-module.zip
          ( cd mod_stage && zip -r9 "$GITHUB_WORKSPACE/susfs-lkm-module.zip" . )
          unzip -l "$GITHUB_WORKSPACE/susfs-lkm-module.zip"

      - name: ⬆️ Upload SUSFS-LKM module [LKM mode]
        if: env.SUSFS_LKM == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: susfs-lkm-module
          path: susfs-lkm-module.zip
          if-no-files-found: error

      - name: 🖼️ Generate DTB (kona + kona-v2 + kona-v2.1)
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          # 不同内核树里 dtb 的落点不同：
          #   lineage / luk / crdroid 树 -> arch/arm64/boot/dts/vendor/oplus
          #   Tropsi-X（OOS stock 衍生）-> arch/arm64/boot/dts/vendor/<project>
          # 且 Tropsi-X 默认 CONFIG_BUILD_ARM64_DT_OVERLAY=y，各 project 的
          # dts Makefile 只编 kona-mtp-overlay.dtbo，不产出 kona.dtb。
          # 此时跳过 dtb.img，让 AnyKernel3 保留设备原有 dtb（否则 cat 失败会中断构建）。
          DTB_SRC=""
          for d in \
            out/arch/arm64/boot/dts/vendor/oplus \
            out/arch/arm64/boot/dts/vendor/19811 \
            out/arch/arm64/boot/dts/vendor/19805; do
            if [ -f "$d/kona.dtb" ]; then DTB_SRC="$d"; break; fi
          done
          if [ -n "$DTB_SRC" ]; then
            cat "$DTB_SRC"/kona.dtb "$DTB_SRC"/kona-v2.dtb "$DTB_SRC"/kona-v2.1.dtb > out/arch/arm64/boot/dtb.img
            echo "[+] Generated dtb.img from $DTB_SRC"
          else
            echo "[-] No kona.dtb produced by this kernel tree (overlay-only dts build)."
            echo "[-] Skipping dtb.img - AnyKernel3 keeps the device's existing dtb."
          fi

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files

