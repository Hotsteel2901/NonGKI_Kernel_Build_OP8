name: Build and Release Kernel

permissions:
  contents: write
  actions: write
  # 说明：tag 会指向「含 .github/workflows/ 变更」的 commit。
  # 早期实现用 `git push --tags` 推整条 tag 历史，GitHub 会以
  # "refusing to allow ... without workflows permission" 拒绝。
  # 正确修法是「只推当前 tag」：git push origin refs/tags/$NEW_TAG
  # —— 这样不携带 workflow 文件历史，无需 workflows 权限域。
  # 注意：`workflows` 不是合法的 permissions 作用域，写上会让整个
  # 工作流文件被判为 Invalid workflow file，切勿再加回来。

on:
  workflow_dispatch:
    inputs:
      build-kernel:
        description: 'Build Kernel ?'
        required: true
        type: boolean
        default: true

      release-kernel:
        description: 'Release Kernel ?'
        required: true
        type: boolean
        default: true



      # ─────────────────────────────────────────────────────────────────────
      # VFS 路径重定向后端（二选一，互斥！）
      # ─────────────────────────────────────────────────────────────────────
      # HybridMount / NoMount 都劫持同一层 VFS，且各自使用
      # 独立不兼容的 keyring 协议，最多只能开一个。这里的值会透传给
      # build-kernel.yml，再传给 build-oneplus-8-los23-a16.yml 做互斥校验。
      vfs_hybridmount:
        description: 'VFS 后端: Hybrid Mount (默认开启)'
        required: true
        type: boolean
        default: true
      vfs_nomount:
        description: 'VFS 后端: NoMount (与 Hybrid Mount 互斥)'
        required: true
        type: boolean
        default: false

jobs:
  build-kernel:
    name: "Step Build Kernel"
    uses: ./.github/workflows/build-kernel.yml
    secrets: inherit
    strategy:
      fail-fast: true
    if: github.event_name == 'workflow_dispatch' && inputs.build-kernel == true
    with:
      vfs_hybridmount: ${{ inputs.vfs_hybridmount }}
      vfs_nomount: ${{ inputs.vfs_nomount }}

  release-kernel:
    name: "Step Release Kernel"
    runs-on: ubuntu-latest
    needs:
      - build-kernel
    if: github.event_name == 'workflow_dispatch' && inputs.build-kernel == true
    env:
      # 构建 job 实际编译的 commit；拿不到时回退到本 job 的 checkout HEAD。
      BUILD_SHA: ${{ needs.build-kernel.outputs.build_sha }}
      REPO_OWNER: Hotsteel2901
      REPO_NAME: NonGKI_Kernel_Build_OP8
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 包格式：仅用于 release 文案里的「Build info」区块，和实际打包保持一致。
      PACK_METHOD: "HotSPatch1"
      # Release 标题格式：分支（管理器/形态） + 时间。
      # Pure 分支不含任何 root 实现，所以标题不写 BakaSU。
      # 时间由 ${TIME} 在运行时拼接，这里只写前缀部分。
      RELEASE_NAME: "Pure (No Root)"
      RELEASE_NOTES: |
        ### English

        | Device | Codename | Kernel | System | Android | Package | Root | SuSFS | Re:Kernel | BBG | DroidSpace |
        |----------|----------|----------|----------|----------|----------|----------|----------|----------|----------|----------|
        | OnePlus 8 | instantnoodle | 4.19 (`lineage-23.2`) | LineageOS 23.2 / AOSP-based | 16 | **HotSPatch1** | none (patch it yourself) | — | ✓ | ✓ | ✓ |

        **What is inside**

        - **Kernel source**: `LineageOS/android_kernel_oneplus_sm8250` @ `lineage-23.2`
        - **Root**: **none**. This is a clean kernel — no KernelSU / BakaSU / SukiSU, no SuSFS.
          Patch `boot-patched.img` with **Magisk** or **APatch** if you want root later.
        - **VFS backend**: **Hybrid Mount** *or* **NoMount** — mutually exclusive, only one is compiled in. The backend actually included is listed in **Build info** at the bottom of this release.
        - **Extras**: Re:Kernel-X, DroidSpaces, Baseband Guard (BBG)

        #### This is NOT an AnyKernel3 zip

        `HotSPatch1` is a self-contained tool that swaps the kernel inside **your own** `boot.img` on a PC. It does not run in recovery.

        #### Installation

        1. Download and **extract** the `*.zip` to a folder.
        2. Put your **stock / current `boot.img`** into that folder (keep the name `boot.img`; if it is the only `.img`, it is detected automatically).
        3. Run the patcher:

           **Linux / macOS**
           ```bash
           chmod +x patch.sh
           ./patch.sh
           ```

           **Windows**
           ```
           Double-click patch.bat   (requires Python 3 in PATH)
           ```
        4. On success you get **`boot-patched.img`** in the same folder.
        5. Flash it:
           ```bash
           adb reboot bootloader
           fastboot flash boot boot-patched.img
           fastboot reboot
           ```

        **Want root?** Patch `boot-patched.img` with **Magisk** (ramdisk) or **APatch** (kernel), then flash the result instead.

        > **Notes**
        > - The tool only replaces the kernel segment: ramdisk / dtb / cmdline / addresses are preserved, page size is re-aligned, the header SHA1 is recomputed, and any AVB footer is stripped (signature is invalid after modifying the kernel).
        > - **Keep your original `boot.img`** — it is your rollback path (`fastboot flash boot boot.img`).
        > - boot header **v3 / v4 (GKI)** is rejected with a clear error instead of producing a broken image.
        > - The kernel must match your ROM version (built for LineageOS 23.2 / Android 16). First boot may take 5–10 minutes.

        ---

        ### 中文

        | 设备 | 代号 | 内核 | 系统 | Android | 包格式 | Root | SuSFS | Re:Kernel | BBG | DroidSpace |
        |----------|----------|----------|----------|----------|----------|----------|----------|----------|----------|----------|
        | OnePlus 8 | instantnoodle | 4.19（`lineage-23.2`） | LineageOS 23.2 / 类原生 | 16 | **HotSPatch1** | 无（自行修补） | — | ✓ | ✓ | ✓ |

        **包含内容**

        - **内核源码**：`LineageOS/android_kernel_oneplus_sm8250` @ `lineage-23.2`
        - **Root**：**没有**。这是纯净内核 —— 不含 KernelSU / BakaSU / SukiSU，也不含 SuSFS。
          需要 root 时，自行用 **Magisk** 或 **APatch** 修补 `boot-patched.img`。
        - **VFS 后端**：**Hybrid Mount** 或 **NoMount**，二者互斥，内核里只会编进其中一个。实际集成的是哪个，见本 Release 底部的 **构建信息**。
        - **附加组件**：Re:Kernel-X、DroidSpaces、Baseband Guard（BBG）

        #### 这不是 AnyKernel3 刷机包

        `HotSPatch1` 是一个在电脑上运行的独立工具：把你**自己的** `boot.img` 里的内核换成包内的新内核。它不在 recovery 里刷。

        #### 安装说明

        1. 下载 `*.zip` 并**解压**到一个文件夹。
        2. 把你的**原机 / 当前 `boot.img`** 放进这个文件夹（文件名保持 `boot.img`；如果目录里只有一个 `.img`，脚本会自动识别）。
        3. 执行替换：

           **Linux / macOS**
           ```bash
           chmod +x patch.sh
           ./patch.sh
           ```

           **Windows**
           ```
           双击 patch.bat   （需要 Python 3 已加入 PATH）
           ```
        4. 成功后同目录会生成 **`boot-patched.img`**。
        5. 刷入：
           ```bash
           adb reboot bootloader
           fastboot flash boot boot-patched.img
           fastboot reboot
           ```

        **想要 root？** 用 **Magisk**（改 ramdisk）或 **APatch**（改内核）修补 `boot-patched.img`，然后刷修补后的镜像。

        > **注意**
        > - 工具只替换 boot.img 的 kernel 段：ramdisk / dtb / cmdline / 地址字段全部原样保留，按原镜像 page_size 重新对齐，重算 header 的 SHA1；若原镜像带 AVB footer 会被剥离（改内核后原签名必然失效）。
        > - **务必保留原始 `boot.img`** —— 它就是你的回滚路径（`fastboot flash boot boot.img`）。
        > - boot header **v3 / v4（GKI）** 会明确报错退出，不会产出坏镜像。
        > - 内核必须与 ROM 版本匹配（本内核面向 LineageOS 23.2 / Android 16）。首次开机可能需要 5–10 分钟。

    steps:
      # Checkout the code
      # fetch-depth: 0 —— 需要完整历史才能按 SHA 建 tag（部分克隆取不到旧 commit）。
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Download Artifacts for A12 (Only if A12 Build is successful or input is true or empty)
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded-artifacts

      # Get the Latest Tag from GitHub
      - name: Generate and Create New Tag
        run: |
          # 注意：原实现在此拉取 LATEST_TAG，但后续从未使用（死代码），
          # 去重逻辑已改到下面基于 git ls-remote 的冲突递增里，故删除。

          # Pure 分支不含任何 root 实现：不必 clone 五个 KernelSU 仓库去算管理器版本，
          # tag 直接用 <分支>-<UTC 日期>-<Unix 时间戳>。
          # 这样既省掉一轮网络依赖，也让 tag 语义与「纯净内核」一致。
          # 撞名时递增 -2 / -3。
          BRANCH="${GITHUB_REF_NAME:-$(git rev-parse --abbrev-ref HEAD)}"
          BASE_TAG="${BRANCH}-$(date -u +%Y%m%d)-$(date +%s)"
          NEW_TAG="$BASE_TAG"
          n=1
          while git ls-remote --exit-code --tags origin "refs/tags/$NEW_TAG" >/dev/null 2>&1; do
            n=$((n + 1))
            NEW_TAG="${BASE_TAG}-${n}"
            echo "[!] tag 已存在，尝试: $NEW_TAG"
          done

          echo "[+] New tag: $NEW_TAG"

          TIME=$(date +"%Y-%m-%d %H:%M")
          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV

          # ---- tag 目标 ----
          # 优先指向「本次真正编译的 commit」（build job 透传上来的 SHA），
          # 拿不到才退回当前 checkout HEAD。
          TAG_TARGET="${BUILD_SHA:-$(git rev-parse HEAD)}"
          if ! git cat-file -e "${TAG_TARGET}^{commit}" 2>/dev/null; then
            echo "[!] BUILD_SHA=$TAG_TARGET 本地不存在，回退到 HEAD"
            TAG_TARGET="$(git rev-parse HEAD)"
          fi
          echo "[+] Tag target: $TAG_TARGET"

          git tag "$NEW_TAG" "$TAG_TARGET"

          # ---- 只推当前 tag ----
          # 旧写法 git push --tags 会把本地所有 tag（连同其引用历史）一起推，
          # 一旦其中某个 tag 指向改动过 .github/workflows/ 的 commit，
          # 整个 push 都会被 GitHub 拒绝（workflows 权限校验），
          # release 因此整体失败。改成只推这一个 tag。
          git push origin "refs/tags/$NEW_TAG"

          # Input release note
          # Input release note
          # 实际集成的是哪个 VFS 后端：取本次构建的 UI 选择，写进 Build info，
          # 避免用户只能靠刷机包标题猜。
          if [ "${{ inputs.vfs_hybridmount }}" = "true" ]; then
            VFS_LABEL="Hybrid Mount"
          elif [ "${{ inputs.vfs_nomount }}" = "true" ]; then
            VFS_LABEL="NoMount"
          else
            VFS_LABEL="none"
          fi
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$RELEASE_NOTES" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "---" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "**Build info / 构建信息**" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "- Branch / 分支: \`$BRANCH\`" >> $GITHUB_ENV
          echo "- Kernel commit / 内核提交: \`$TAG_TARGET\`" >> $GITHUB_ENV
          echo "- Package format / 包格式: \`$PACK_METHOD\`" >> $GITHUB_ENV
          echo "- VFS backend / VFS 后端: \`$VFS_LABEL\`" >> $GITHUB_ENV
          echo "- Root implementation / Root 实现: \`none (patch boot-patched.img with Magisk / APatch)\`" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # Create GitHub Release and upload files if make_release is true
      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ env.NEW_TAG }}
          prerelease: false
          release_name: "${{ env.RELEASE_NAME }} ${{ env.TIME }}"
          body: ${{ env.RELEASE_NOTES }}

      - name: Upload Release Assets Dynamically
        run: |
          # Loop through all files in the downloaded-artifacts directory
          for file in ./downloaded-artifacts/Kernel-*/*; do
              # Skip directories
              if [ -d "$file" ]; then
                  continue
              fi

              # Upload the file to the GitHub release
              echo "Uploading $file..."
              gh release upload ${{ env.NEW_TAG }} "$file"
          done

      # Display Files Uploaded
      - name: Display Files Uploaded
        run: |
          echo "GitHub release created with the following files:"
          ls ./downloaded-artifacts/**/*

