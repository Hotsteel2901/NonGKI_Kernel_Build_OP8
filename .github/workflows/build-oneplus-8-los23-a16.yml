name: Build Oneplus 8 (LineageOS 23.2 A16) (BakaSU+SUSFS Kernel)

# ============================================================================
# 可复用构建工作流（OnePlus 8 / LineageOS 23.2 A16）
#
# 由 build-kernel.yml 通过 workflow_call 调用，3 个 VFS 后端开关以
# inputs.* 传入（UI 控件定义在 build-kernel.yml / build-release.yml）。
# 这里同时声明 workflow_dispatch 直触发时所需的同默认值，保证两种入口
# 行为一致；真正生效的读取在下方 Validate 步骤里（inputs.* 优先）。
# ============================================================================
on:
  workflow_call:
    inputs:
      vfs_hybridmount:
        description: 'VFS 后端: Hybrid Mount (默认开启)'
        required: false
        type: boolean
        default: true
      vfs_nomount:
        description: 'VFS 后端: NoMount (与 Hybrid Mount 互斥)'
        required: false
        type: boolean
        default: false
      vfs_zeromount:
        description: 'VFS 后端: ZeroMount (4.19 自研移植, 与另两个互斥)'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      vfs_hybridmount:
        description: 'VFS 后端: Hybrid Mount (默认开启)'
        required: true
        type: boolean
        default: true
      vfs_nomount:
        description: 'VFS 后端: NoMount (与 Hybrid Mount 互斥)'
        required: true
        type: boolean
        default: false
      vfs_zeromount:
        description: 'VFS 后端: ZeroMount (4.19 自研移植, 与另两个互斥)'
        required: true
        type: boolean
        default: false

env:
  # Device env
  DEVICE_NAME : "oneplus_8"
  DEVICE_CODENAME : "instantnoodle"

  # AK3 刷机包在 recovery 里显示的标题行。
  # 格式: 管理器（分支名） + 集成内容 Built By hotsteel
  # VFS 段由下方 build 步骤按实际启用的后端动态拼进 AK3_TITLE，
  # 这里只给静态部分（不含 VFS），避免标题与实际集成内容不一致。
  # 注意: 不要在此定义 AK3_TITLE —— workflow 级 env 会覆盖 GITHUB_ENV 里的
  # 运行时值，导致动态组装的标题失效。AK3_TITLE 由 Validate 步骤写入。
  AK3_TITLE_PREFIX: "BakaSU (Luk) + SUSFS v2.3.0"
  AK3_TITLE_SUFFIX: "ReKernel-X + DroidSpaces + Baseband Guard Built By hotsteel"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : ""

  KERNEL_SOURCE : "https://github.com/LineageOS/android_kernel_oneplus_sm8250.git"
  KERNEL_BRANCH : "lineage-23.2"

  CLANG_SOURCE : "https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/LLVM-19.1.7-Linux-X64.tar.xz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/kona-perf_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  # 保持 latest: 每次构建都会通过 BakaSU setup.sh (git pull) 拉取最新 main 分支
  KERNELSU_AUTO_GET : "true" # if u want easy setting kernelsu, u can true.
  KERNELSU_AUTO_FORK : "resukisu" # xxksu, rsuntk, next, resukisu and sukisu

  SUSFS_ENABLE : true
  SUSFS_FIXED : false

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "lineage23.2_a16"

  # Other env
  PYTHON_VERSION: "3"

  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"

  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""

  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: "true"
  DROIDSPACES_ENABLE: "true"

  # ─────────────────────────────────────────────────────────────────────────
  # VFS 路径重定向后端（三选一，互斥！）
  # ─────────────────────────────────────────────────────────────────────────
  # 这三个都工作在同一个内核层（劫持 inode_operations / file_operations /
  # dentry_operations），并各自使用**独立且不兼容的 keyring 协议**
  # （HybridMount 用 "hm1" / NoMount 用 "NOMOUNT" / ZeroMount 用自有协议）。
  # 上游 Hybrid Mount 的 Kconfig 里就明确写了：
  #   "not compatible with NoMount's metamodule or its tooling"
  # 同时开启会让两套驱动抢同一层 hook，轻则元模块认不到内核、重则崩溃。
  # 因此**最多只能开一个**，构建开头有互斥校验，开了多个直接 fail。
  #
  # 默认值仅作 workflow_call 未传参时的兜底：真正生效的值来自
  # inputs.vfs_*（UI 定义在 build-kernel.yml / build-release.yml）。
  # Validate 步骤用 ${VFS_HYBRIDMOUNT:-true} 这种 shell 默认值兜底，
  # 因此这里保留同名 env 是安全的（不会被当默认来源误用）。
  #
  # 默认: HybridMount 开, 其余关（HybridMount 是本仓库长期验证过的组合）。
  VFS_HYBRIDMOUNT: "true"  # Hybrid Mount VFS 后端 (fs/hybridmount, 4.19 内置移植)
  VFS_NOMOUNT: "false"     # NoMount VFS 后端 (fs/nomount, 上游 setup.sh 集成)
  VFS_ZEROMOUNT: "false"   # ZeroMount VFS 后端 (4.19 自研移植版, 与另两个互斥)

  HOOK_METHOD: "syscall" # Manual hook method -> syscall.

  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: ""

  BASEBAND_GUARD_ENABLE: "true"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false" # if u kernel need DTB , but cannot auto generate it. (Only Anykernel3).
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "true" # Merge config files.
  MERGE_CONFIG_FILES: "vendor/oplus.config"

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Oneplus 8 (LineageOS 23.2 A16) (BakaSU+SUSFS Kernel)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🧭 Validate VFS backend selection (mutually exclusive)
        run: |
          # HybridMount / NoMount / ZeroMount 三者互斥：它们都劫持同一层 VFS
          # (inode_operations / file_operations / dentry_operations)，且各自使用
          # 独立不兼容的 keyring 协议。同时启用会导致两套驱动抢同一批 hook，
          # 元模块无法正确握手（认不到内核），严重时直接崩溃。
          # 这里做前置校验，开了多个就立刻 fail，避免产出一个坏内核。
          #
          # 开关来源: inputs.vfs_*（UI 定义在 build-kernel.yml /
          # build-release.yml，这里只负责接收与校验）。
          # 用 ${VAR:-默认值} 兜底，防止 workflow_call 未传参时变量为空
          # 而被当成 "false" 处理。
          HM="${{ inputs.vfs_hybridmount }}"
          NM="${{ inputs.vfs_nomount }}"
          ZM="${{ inputs.vfs_zeromount }}"
          HM="${HM:-true}"
          NM="${NM:-false}"
          ZM="${ZM:-false}"

          COUNT=0
          [ "$HM" = "true" ] && COUNT=$((COUNT + 1))
          [ "$NM" = "true" ] && COUNT=$((COUNT + 1))
          [ "$ZM" = "true" ] && COUNT=$((COUNT + 1))

          echo "VFS backend selection:"
          echo "  VFS_HYBRIDMOUNT = $HM"
          echo "  VFS_NOMOUNT     = $NM"
          echo "  VFS_ZEROMOUNT   = $ZM"

          if [ "$COUNT" -gt 1 ]; then
            echo ""
            echo "[-] ERROR: VFS backends are mutually exclusive, but $COUNT are enabled."
            echo "[-] HybridMount / NoMount / ZeroMount all hijack the same VFS layer and"
            echo "[-] use incompatible keyring protocols. Enable at most ONE of them."
            exit 1
          fi

          if [ "$COUNT" -eq 0 ]; then
            echo "[i] No VFS backend selected — building without path redirection."
          else
            echo "[+] VFS backend check passed."
          fi

          # 组装 AK3 标题：只在真正启用某个 VFS 后端时才把对应名字写进去，
          # 保证标题与内核实际集成内容一致。写入 $GITHUB_ENV 供打包步骤读取。
          VFS_LABEL=""
          if [ "$HM" = "true" ]; then VFS_LABEL="Hybrid Mount VFS"; fi
          if [ "$NM" = "true" ]; then VFS_LABEL="NoMount VFS"; fi
          if [ "$ZM" = "true" ]; then VFS_LABEL="ZeroMount VFS"; fi

          TITLE="${{ env.AK3_TITLE_PREFIX }}"
          if [ -n "$VFS_LABEL" ]; then
            TITLE="$TITLE + $VFS_LABEL"
          fi
          TITLE="$TITLE + ${{ env.AK3_TITLE_SUFFIX }}"

          echo "AK3_TITLE=$TITLE" >> $GITHUB_ENV
          echo "[+] AK3 title will be: $TITLE"

      - name: 📌 Use latest kernel source (no pinned checkout)
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          grep -q "kernelsu" drivers/Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
          grep -q "source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig || sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig
          echo "-g$(git rev-parse --short HEAD)-hotsteel" > .scmversion

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch BakaSU Inline Hooks
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/
          cp /tmp/Patches/Patch/resukisu_inline_hooks.patch ./
          patch -p1 < resukisu_inline_hooks.patch || true
          rm -f resukisu_inline_hooks.patch
          echo "[+] BakaSU inline hooks patched."

      - name: 🧩 Patch Hybrid Mount VFS Subsystem
        if: inputs.vfs_hybridmount == true
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/

          # Hybrid Mount 的 VFS 后端不是内核通用 VFS，而是它自己的 hybridmount 子系统
          # （fork 自 NoMount，通过 keyring 驱动）。它只提供 5.10/5.15/6.1/6.6/6.12 的
          # 预编译 .ko，4.19 一个候选都匹配不到，所以必须 built-in 集成。
          # 本子系统与 SUSFS / BakaSU 完全解耦（不引用任何 ksu_/susfs_ 符号），
          # 与 SUSFS 补丁仅在 fs/Makefile 尾部追加处有交集，补丁顺序对结果无影响。
          cp /tmp/Patches/Patch/hybridmount_patch_to_4.19.patch ./
          patch -p1 < hybridmount_patch_to_4.19.patch || true
          rm -f hybridmount_patch_to_4.19.patch

          # patch -p1 加了 || true，若真有 hunk 打不上这里必须报出来
          if [ -n "$(find . -name '*.rej')" ]; then
            echo "[-] hybridmount_patch has rejected hunks!"
            find . -name "*.rej" -exec cat {} \;
            false
          fi

          # 集成结果自检
          test -f fs/hybridmount/hybridmount.c || { echo "[-] fs/hybridmount/hybridmount.c missing"; false; }
          grep -qF 'obj-$(CONFIG_HYBRIDMOUNT) += hybridmount/' fs/Makefile || { echo "[-] fs/Makefile not wired"; false; }
          grep -qF 'source "fs/hybridmount/Kconfig"' fs/Kconfig || { echo "[-] fs/Kconfig not wired"; false; }
          echo "[+] Hybrid Mount VFS subsystem patched (built-in)."

      - name: ⚙️ Enable Hybrid Mount VFS in DEFCONFIG
        if: inputs.vfs_hybridmount == true
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          DEFCONFIG_PATH="./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"

          # CONFIG_KEYS=y 是 hybridmount 的硬依赖（它要 register_key_type）。
          # 显式写出来，免得将来有人关掉 FS_ENCRYPTION 时把 keyring 一起带走。
          # 注意：只加 CONFIG_KEYS=y 不够，KEYS 还 select ASSOCIATIVE_ARRAY。
          sed -i '/^CONFIG_KEYS=/d' "$DEFCONFIG_PATH"
          sed -i '/^CONFIG_ASSOCIATIVE_ARRAY=/d' "$DEFCONFIG_PATH"
          echo "CONFIG_KEYS=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_ASSOCIATIVE_ARRAY=y" >> "$DEFCONFIG_PATH"

          # =y 而不是 =m：4.19 没有对应的预编译 .ko，内置进内核镜像才生效。
          sed -i '/^CONFIG_HYBRIDMOUNT=/d' "$DEFCONFIG_PATH"
          echo "CONFIG_HYBRIDMOUNT=y" >> "$DEFCONFIG_PATH"

          echo "[+] Appended to ${DEFCONFIG_PATH}:"
          grep -nE "CONFIG_(HYBRIDMOUNT|KEYS|ASSOCIATIVE_ARRAY)=" "$DEFCONFIG_PATH"

      - name: 🕳️ Patch NoMount VFS Subsystem
        if: inputs.vfs_nomount == true
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/

          # NoMount 与 HybridMount 是同源不同家的方案：HybridMount 的 hybridmount
          # 子系统就是从 NoMount fork 出来的，但**重命名了符号、换了自己的 wire magic**
          # （HybridMount 用 "HYBRIDMO"），因此两套元模块与工具链互不通用。
          # 二者只能选一个，构建开头的互斥校验会拦截同时开启的情况。
          #
          # NoMount 官方仓库自带 kernel/setup.sh，做的是通用内核集成
          # （把 NoMount 源码 symlink 到 fs/nomount，并往 fs/Makefile + fs/Kconfig
          #  接线），不依赖具体内核版本 —— 上游文档说明 4.19 这类 legacy 内核
          # 无法用预编译 .ko，必须源码集成，这个脚本正是干这个的。
          # 集成方式与上游 JackA1ltman/NonGKI_Kernel_Build_2nd 的 patch-nomount 一致。
          curl -sSL "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" | bash -s

          # setup.sh 的失败不一定反映到管道的退出码（curl | bash 只取 bash 的），
          # 所以这里做集成结果自检。
          test -d fs/nomount || { echo "[-] fs/nomount missing (symlink not created)"; false; }
          test -f fs/nomount/nomount.c || { echo "[-] fs/nomount/nomount.c missing"; false; }
          grep -q "nomount" fs/Makefile || { echo "[-] fs/Makefile not wired"; false; }
          grep -q "fs/nomount/Kconfig" fs/Kconfig || { echo "[-] fs/Kconfig not wired"; false; }
          echo "[+] NoMount VFS subsystem patched (built-in)."

      - name: ⚙️ Enable NoMount VFS in DEFCONFIG
        if: inputs.vfs_nomount == true
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          DEFCONFIG_PATH="./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"

          # CONFIG_KEYS / CONFIG_ASSOCIATIVE_ARRAY 同样是 NoMount 的硬依赖：
          # 它与 userspace 的 nm 二进制之间完全靠 Linux keyring 通信
          # （add_key），不依赖 /dev 节点与 ioctl。
          sed -i '/^CONFIG_KEYS=/d' "$DEFCONFIG_PATH"
          sed -i '/^CONFIG_ASSOCIATIVE_ARRAY=/d' "$DEFCONFIG_PATH"
          echo "CONFIG_KEYS=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_ASSOCIATIVE_ARRAY=y" >> "$DEFCONFIG_PATH"

          # NoMount 是 drop-in 内核子系统，同样必须 =y 内置（4.19 无预编译 .ko）。
          sed -i '/^CONFIG_NOMOUNT=/d' "$DEFCONFIG_PATH"
          echo "CONFIG_NOMOUNT=y" >> "$DEFCONFIG_PATH"

          echo "[+] Appended to ${DEFCONFIG_PATH}:"
          grep -nE "CONFIG_(NOMOUNT|KEYS|ASSOCIATIVE_ARRAY)=" "$DEFCONFIG_PATH"

      - name: 🔮 Patch ZeroMount VFS Subsystem
        if: inputs.vfs_zeromount == true
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/

          # ZeroMount 是 Enginex0/zeromount 的路径重定向子系统，与 HybridMount /
          # NoMount 完全不同源：它自带 /dev/zeromount 字符设备 + 自定义 ioctl
          # 协议（不依赖 keyring），因此 CONFIG_KEYS 不是它的依赖。
          #
          # 上游只提供 5.4 / 5.10 / 5.15 / 6.1 / 6.6 / 6.12 的补丁，non-GKI 4.19
          # 在它的 roadmap 里仍标着 Planned —— 本仓库的这份补丁是自研移植版。
          #
          # ⚠️ 移植补丁的基线是「SUSFS + HybridMount 之后」的树，因为它与这两个
          # 补丁在 fs/Makefile / fs/Kconfig / fs/readdir.c / fs/proc/task_mmu.c
          # 上有大量上下文重叠：
          #   * SUSFS 重写了 fs/readdir.c 的 iterate_dir 调用点（加 #ifdef 与
          #     orig_flow: 标签），ZeroMount 的 dents 注入必须挂在同一位置；
          #   * 两者都要往 fs/proc/task_mmu.c 的 show_map_vma 插钩子；
          #   * HybridMount 在 fs/Makefile 尾部追加了自己的 obj- 行。
          # 因此本步骤必须排在 SUSFS / BakaSU hooks / HybridMount 之后。
          cp /tmp/Patches/Patch/zeromount_patch_to_4.19.patch ./
          patch -p1 < zeromount_patch_to_4.19.patch || true
          rm -f zeromount_patch_to_4.19.patch

          # patch -p1 加了 || true：真有 hunk 打不上必须立刻报出来，
          # 否则会出现「内核少了一半钩子却照样编译过」的静默失败。
          if [ -n "$(find . -name '*.rej')" ]; then
            echo "[-] zeromount_patch has rejected hunks!"
            find . -name "*.rej" -exec sh -c 'echo "--- {} ---"; cat {}' \;
            false
          fi

          # 集成结果自检
          test -f fs/zeromount.c || { echo "[-] fs/zeromount.c missing"; false; }
          test -f include/linux/zeromount.h || { echo "[-] include/linux/zeromount.h missing"; false; }
          grep -qF 'obj-$(CONFIG_ZEROMOUNT)		+= zeromount.o' fs/Makefile || { echo "[-] fs/Makefile not wired"; false; }
          grep -qF 'config ZEROMOUNT' fs/Kconfig || { echo "[-] fs/Kconfig not wired"; false; }
          # 钩子必须真的落到 VFS 层，不能只把驱动文件拷进去
          grep -q 'zeromount_inject_dents64' fs/readdir.c || { echo "[-] fs/readdir.c hook missing"; false; }
          grep -q 'zeromount_stat_hook' fs/stat.c || { echo "[-] fs/stat.c hook missing"; false; }
          grep -q 'zeromount_getname_hook' fs/namei.c || { echo "[-] fs/namei.c hook missing"; false; }
          # SUSFS 的 readdir 改写不能被我们覆盖掉
          grep -q 'CONFIG_KSU_SUSFS_SUS_PATH' fs/readdir.c || { echo "[-] SUSFS readdir hooks lost!"; false; }
          echo "[+] ZeroMount VFS subsystem patched (built-in, SUSFS-aware)."

      - name: ⚙️ Enable ZeroMount VFS in DEFCONFIG
        if: inputs.vfs_zeromount == true
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          DEFCONFIG_PATH="./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"

          # ZeroMount 走自己的字符设备 + ioctl，不用 keyring，所以不需要
          # CONFIG_KEYS / CONFIG_ASSOCIATIVE_ARRAY（那是 HM / NoMount 的依赖）。
          #
          # =y 而不是 =m：它 hook 的是 inode_permission / iterate_dir / vfs_getattr
          # 这些核心 VFS 路径，必须编进内核镜像，做不成模块。
          sed -i '/^CONFIG_ZEROMOUNT=/d' "$DEFCONFIG_PATH"
          echo "CONFIG_ZEROMOUNT=y" >> "$DEFCONFIG_PATH"

          echo "[+] Appended to ${DEFCONFIG_PATH}:"
          grep -nE "CONFIG_ZEROMOUNT=" "$DEFCONFIG_PATH"


      - name: 🪛 Extra Kernel Options
        run: |
          # Only ${{ env.DEVICE_NAME }} use it.
          cd $GITHUB_WORKSPACE/device_kernel

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🖼️ Generate DTB (kona + kona-v2 + kona-v2.1)
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          cat out/arch/arm64/boot/dts/vendor/oplus/kona.dtb out/arch/arm64/boot/dts/vendor/oplus/kona-v2.dtb out/arch/arm64/boot/dts/vendor/oplus/kona-v2.1.dtb > out/arch/arm64/boot/dtb.img
          echo "[+] Generated dtb.img"

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files

