name: Build Oneplus 8 (LineageOS 23.2 A16) (KernelSU-xxksu+SUSFS Kernel)

# ============================================================================
# 可复用构建工作流（OnePlus 8 / LineageOS 23.2 A16）
#
# 由 build-kernel.yml 通过 workflow_call 调用，3 个 VFS 后端开关以
# inputs.* 传入（UI 控件定义在 build-kernel.yml / build-release.yml）。
# 这里同时声明 workflow_dispatch 直触发时所需的同默认值，保证两种入口
# 行为一致；真正生效的读取在下方 Validate 步骤里（inputs.* 优先）。
# ============================================================================
on:
  workflow_call:
    inputs:
      susfs_enable:
        description: '集成 SUSFS (默认开启; KSU 分支为手写桥接, 关闭则不集成)'
        required: false
        type: boolean
        default: true
      vfs_hybridmount:
        description: 'VFS 后端: Hybrid Mount (默认开启)'
        required: false
        type: boolean
        default: true
      vfs_nomount:
        description: 'VFS 后端: NoMount (与 Hybrid Mount 互斥)'
        required: false
        type: boolean
        default: false
      vfs_zeromount:
        description: 'VFS 后端: ZeroMount (4.19 自研移植, 与另两个互斥)'
        required: false
        type: boolean
        default: false
    # 把「实际参与编译的内核 commit」向上暴露给 build-kernel / build-release，
    # 让 release tag 能精确打在这个 commit 上，而不是 release job 自己
    # checkout 出来的 HEAD（并发/后续提交场景下两者可能不同）。
    outputs:
      build_sha:
        description: '本次内核实际构建所用的 commit SHA'
        value: ${{ jobs.build-kernel.outputs.build_sha }}
  workflow_dispatch:
    inputs:
      susfs_enable:
        description: '集成 SUSFS (默认开启; KSU 分支为手写桥接, 关闭则不集成)'
        required: true
        type: boolean
        default: true
      vfs_hybridmount:
        description: 'VFS 后端: Hybrid Mount (默认开启)'
        required: true
        type: boolean
        default: true
      vfs_nomount:
        description: 'VFS 后端: NoMount (与 Hybrid Mount 互斥)'
        required: true
        type: boolean
        default: false
      vfs_zeromount:
        description: 'VFS 后端: ZeroMount (4.19 自研移植, 与另两个互斥)'
        required: true
        type: boolean
        default: false
env:
  # Device env
  DEVICE_NAME : "oneplus_8"
  DEVICE_CODENAME : "instantnoodle"

  # AK3 刷机包在 recovery 里显示的标题行。
  # 格式: 管理器（分支名） + 集成内容 Built By hotsteel
  # 本分支 root 实现是 backslashxx 的 KernelSU（非 BakaSU），故管理器名如实写作 KernelSU。
  # AK3 刷机包在 recovery 里显示的标题行。
  # 格式: 管理器（分支名） + 集成内容 Built By hotsteel
  # VFS 段由下方 build 步骤按实际启用的后端动态拼进 AK3_TITLE，
  # 这里只给静态部分（不含 VFS），避免标题与实际集成内容不一致。
  # 注意: 不要在此定义 AK3_TITLE —— workflow 级 env 会覆盖 GITHUB_ENV 里的
  # 运行时值，导致动态组装的标题失效。AK3_TITLE 由 Validate 步骤写入。
  AK3_TITLE_PREFIX: "KernelSU (KSU) + SUSFS v2.3.0"
  AK3_TITLE_SUFFIX: "ReKernel-X + DroidSpaces + Baseband Guard Built By hotsteel"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : ""

  KERNEL_SOURCE : "https://github.com/LineageOS/android_kernel_oneplus_sm8250.git"
  KERNEL_BRANCH : "lineage-23.2"

  CLANG_SOURCE : "https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/LLVM-19.1.7-Linux-X64.tar.xz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/kona-perf_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  # 保持 latest: 每次构建都会通过 backslashxx/KernelSU setup.sh (git pull) 拉取最新 master 分支
  # 补丁对齐基准: backslashxx/KernelSU master @ 1f47db46 (KSU_VERSION=32657, 2026-10 核对)
  #   注: 构建时取的是 master 最新而非固定该 SHA; 该值仅记录"补丁最后一次对齐到的上游状态",
  #       上游若再改动 hook 接口, 请重新生成 backslashxx_susfs_bridge.patch。
  KERNELSU_AUTO_GET : "true" # if u want easy setting kernelsu, u can true.
  KERNELSU_AUTO_FORK : "xxksu" # xxksu, rsuntk, next, resukisu and sukisu

  # SUSFS 由 UI 勾选控制（susfs_enable 输入），默认开启。
  # KSU 分支的 SUSFS 是**手写桥接**（backslashxx_manual_hooks.patch 的 SUSFS 片段
  # + backslashxx_susfs_bridge.patch）；关闭时跳过补丁/SUSFS Kconfig/桥接，
  # 但保留 KernelSU 核心手动钩子（backslashxx_manual_hooks.patch 里 #ifdef CONFIG_KSU 部分）。
  SUSFS_ENABLE : ${{ inputs.susfs_enable }}
  SUSFS_FIXED : false

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "lineage23.2_a16"

  # Other env
  PYTHON_VERSION: "3"

  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"

  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""

  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: "true"
  DROIDSPACES_ENABLE: "true"

  # ─────────────────────────────────────────────────────────────────────────
  # VFS 路径重定向后端（三选一，互斥！）
  # ─────────────────────────────────────────────────────────────────────────
  # 这三个都工作在同一个内核层（劫持 inode_operations / file_operations /
  # dentry_operations），并各自使用**独立且不兼容的 keyring 协议**
  # （HybridMount 用 "hm1" / NoMount 用 "NOMOUNT" / ZeroMount 用自有协议）。
  # 上游 Hybrid Mount 的 Kconfig 里就明确写了：
  #   "not compatible with NoMount's metamodule or its tooling"
  # 同时开启会让两套驱动抢同一层 hook，轻则元模块认不到内核、重则崩溃。
  # 因此**最多只能开一个**，构建开头有互斥校验，开了多个直接 fail。
  #
  # 默认值仅作 workflow_call 未传参时的兜底：真正生效的值来自
  # inputs.vfs_*（UI 定义在 build-kernel.yml / build-release.yml）。
  # Validate 步骤用 ${VFS_HYBRIDMOUNT:-true} 这种 shell 默认值兜底，
  # 因此这里保留同名 env 是安全的（不会被当默认来源误用）。
  #
  # 默认: HybridMount 开, 其余关（HybridMount 是本仓库长期验证过的组合）。
  VFS_HYBRIDMOUNT: "true"  # Hybrid Mount VFS 后端 (fs/hybridmount, 4.19 内置移植)
  VFS_NOMOUNT: "false"     # NoMount VFS 后端 (fs/nomount, 上游 setup.sh 集成)
  VFS_ZEROMOUNT: "false"   # ZeroMount VFS 后端 (4.19 自研移植版, 与另两个互斥)

  HOOK_METHOD: "syscall" # Manual hook method -> syscall.

  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: ""

  BASEBAND_GUARD_ENABLE: "true"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false" # if u kernel need DTB , but cannot auto generate it. (Only Anykernel3).
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "true" # Merge config files.
  MERGE_CONFIG_FILES: "vendor/oplus.config"

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Oneplus 8 (LineageOS 23.2 A16) (KernelSU-xxksu+SUSFS Kernel)
    runs-on: ubuntu-latest
    outputs:
      build_sha: ${{ steps.build_sha.outputs.build_sha }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🧭 Validate VFS backend selection (mutually exclusive)
        run: |
          # HybridMount / NoMount / ZeroMount 三者互斥：它们都劫持同一层 VFS
          # (inode_operations / file_operations / dentry_operations)，且各自使用
          # 独立不兼容的 keyring 协议。同时启用会导致两套驱动抢同一批 hook，
          # 元模块无法正确握手（认不到内核），严重时直接崩溃。
          # 这里做前置校验，开了多个就立刻 fail，避免产出一个坏内核。
          #
          # 开关来源: inputs.vfs_*（UI 定义在 build-kernel.yml /
          # build-release.yml，这里只负责接收与校验）。
          # 用 ${VAR:-默认值} 兜底，防止 workflow_call 未传参时变量为空
          # 而被当成 "false" 处理。
          HM="${{ inputs.vfs_hybridmount }}"
          NM="${{ inputs.vfs_nomount }}"
          ZM="${{ inputs.vfs_zeromount }}"
          HM="${HM:-true}"
          NM="${NM:-false}"
          ZM="${ZM:-false}"

          COUNT=0
          [ "$HM" = "true" ] && COUNT=$((COUNT + 1))
          [ "$NM" = "true" ] && COUNT=$((COUNT + 1))
          [ "$ZM" = "true" ] && COUNT=$((COUNT + 1))

          echo "VFS backend selection:"
          echo "  VFS_HYBRIDMOUNT = $HM"
          echo "  VFS_NOMOUNT     = $NM"
          echo "  VFS_ZEROMOUNT   = $ZM"

          if [ "$COUNT" -gt 1 ]; then
            echo ""
            echo "[-] ERROR: VFS backends are mutually exclusive, but $COUNT are enabled."
            echo "[-] HybridMount / NoMount / ZeroMount all hijack the same VFS layer and"
            echo "[-] use incompatible keyring protocols. Enable at most ONE of them."
            exit 1
          fi

          if [ "$COUNT" -eq 0 ]; then
            echo "[i] No VFS backend selected — building without path redirection."
          else
            echo "[+] VFS backend check passed."
          fi

          # 组装 AK3 标题：只在真正启用某个 VFS 后端时才把对应名字写进去，
          # 保证标题与内核实际集成内容一致（不会出现写着 Hybrid Mount
          # 实际装的是 NoMount 的情况）。写入 $GITHUB_ENV 供后续打包步骤读取。
          VFS_LABEL=""
          if [ "$HM" = "true" ]; then VFS_LABEL="Hybrid Mount VFS"; fi
          if [ "$NM" = "true" ]; then VFS_LABEL="NoMount VFS"; fi
          if [ "$ZM" = "true" ]; then VFS_LABEL="ZeroMount VFS"; fi

          TITLE="${{ env.AK3_TITLE_PREFIX }}"
          if [ -n "$VFS_LABEL" ]; then
            TITLE="$TITLE + $VFS_LABEL"
          fi
          TITLE="$TITLE + ${{ env.AK3_TITLE_SUFFIX }}"

          echo "AK3_TITLE=$TITLE" >> $GITHUB_ENV
          echo "[+] AK3 title will be: $TITLE"

      - name: 📌 Pin kernel to verified base commit
        id: build_sha
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          # build-ready clones with --depth=1, so the pinned commit is not
          # in the shallow history; fetch it explicitly before checkout.
          # setup.sh already edited tracked files (drivers/Makefile/Kconfig),
          # so force the checkout to discard those mods; the untracked
          # KernelSU/ dir + drivers/kernelsu symlink are kept, and the
          # Makefile/Kconfig entries are re-added below.
          git fetch --depth=1 origin 4238ee49a84bd418c8515c297563bb29f95ab40b
          git checkout -f 4238ee49a84bd418c8515c297563bb29f95ab40b
          # 记录本次实际参与编译的内核 commit，向上透传给 release 的 tag 步骤。
          echo "build_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "[+] Build SHA: $(git rev-parse HEAD)" 
          grep -q "kernelsu" drivers/Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
          grep -q "source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig || sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig
          echo "-g4238ee49a84b-hotsteel" > .scmversion

      - name: 🧩 Add SUSFS Kconfig definitions (backslashxx lacks them)
        if: inputs.susfs_enable == true
        run: |
          # backslashxx/KernelSU has no CONFIG_KSU_SUSFS* in its Kconfig;
          # orphan symbols in .config are dropped by olddefconfig, so SUSFS
          # must be defined here to survive kconfig processing.
          cd $GITHUB_WORKSPACE/device_kernel
          grep -q "config KSU_SUSFS" drivers/kernelsu/Kconfig || cat >> drivers/kernelsu/Kconfig <<'EOF'

          menu "KernelSU - SUSFS"
          config KSU_SUSFS
          	bool "Enable SUSFS support (kernel-side)"
          	depends on KSU
          	default y
          	help
          	  Kernel-side SUSFS v2.3.0 support, patched by Patches/Patch/susfs_patch_to_4.19.patch.
          	  Requires THREAD_INFO_IN_TASK (always enabled on arm64).

          config KSU_SUSFS_SUS_PATH
          	bool "Enable to hide suspicious path"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_SUS_MOUNT
          	bool "Enable to hide suspicious mounts"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_SUS_KSTAT
          	bool "Enable to spoof suspicious kstat"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_SPOOF_UNAME
          	bool "Enable to spoof uname"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_ENABLE_LOG
          	bool "Enable logging susfs log to kernel"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          	bool "Enable to automatically hide ksu and susfs symbols from /proc/kallsyms"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          	bool "Enable to spoof /proc/cmdline (non-gki)"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_OPEN_REDIRECT
          	bool "Enable to redirect a path to be opened with another path (experimental)"
          	depends on KSU_SUSFS
          	default y

          config KSU_SUSFS_SUS_MAP
          	bool "Enable hiding some mmapped real files from different proc maps interfaces"
          	depends on KSU_SUSFS
          	default y
          endmenu
          EOF
          echo "[+] SUSFS Kconfig definitions added to drivers/kernelsu/Kconfig."

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch KernelSU Manual Hooks (backslashxx)
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/
          cp /tmp/Patches/Patch/backslashxx_manual_hooks.patch ./
          patch -p1 < backslashxx_manual_hooks.patch
          rm -f backslashxx_manual_hooks.patch
          # patch(1) leaves harmless .orig backups on successful apply; drop them
          find . -name "*.orig" -delete
          echo "[+] KernelSU manual hooks patched."

      - name: 🔗 Patch KernelSU SUSFS Bridge (backslashxx)
        if: inputs.susfs_enable == true
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/
          # Port SUSFS bridge into backslashxx's kernel source
          # (the BakaSU/ReSukiSU branches have this built-in; backslashxx
          # has none, so SUSFS tool commands used to go nowhere).
          # 对齐基准: backslashxx/KernelSU master @ 1f47db46 (KSU_VERSION=32657)
          # 上一次对齐是 b694933 (32628)。b694933..1f47db46 共 26 个提交，属大规模
          # 重构（kernel_compat.h / kernel_includes.h / lsm_hooks_list.c 等），
          # 但本补丁依赖的符号全部保留（ksu_handle_sys_reboot / toolkit_handle_sys_reboot），
          # 仅上下文行号漂移，故已按新 tip 重新锚定，确保 0 offset / 0 fuzz / 0 reject。
          # Adds:
          #  - ksu_handle_susfs_cmd() dispatch (supercall/dispatch.c)
          #  - SUSFS_MAGIC routing in ksu_handle_sys_reboot() (supercall/supercall.c)
          #  - susfs_init() at KSU init (ksu.c)
          #  - susfs_start_sdcard_monitor_fn() on boot completed (supercall/dispatch.c)
          #  - susfs_set_current_proc_umounted() in ksu_handle_umount (feature/kernel_umount.c)
          cp /tmp/Patches/Patch/backslashxx_susfs_bridge.patch ./
          patch -p1 < backslashxx_susfs_bridge.patch
          rm -f backslashxx_susfs_bridge.patch
          # Drop harmless .orig backups (patch(1) creates them on success).
          find . -name "*.orig" -delete
          echo "[+] KernelSU SUSFS bridge patched."

      - name: 🔍 Verify SUSFS bridge applied (fail loudly if missing)
        if: inputs.susfs_enable == true
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          # Only .rej files mean a hunk FAILED -> the bridge is broken,
          # do NOT ship it silently. (.orig files are just patch backups on
          # successful apply, they are cleaned up above.)
          if find . -name "*.rej" | grep -q .; then
            echo "[-] Found un-applied patch hunks (.rej):"
            find . -name "*.rej"
            false
          fi
          # The dispatch symbol must exist in the patched source.
          grep -q "ksu_handle_susfs_cmd" drivers/kernelsu/supercall/dispatch.c
          grep -q "SUSFS_MAGIC" drivers/kernelsu/supercall/supercall.c
          grep -q "susfs_init();" drivers/kernelsu/ksu.c
          echo "[+] SUSFS bridge verified in source tree."

      - name: 🧩 Patch Hybrid Mount VFS Subsystem
        if: inputs.vfs_hybridmount == true
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/

          # Hybrid Mount 的 VFS 后端不是内核通用 VFS，而是它自己的 hybridmount 子系统
          # （fork 自 NoMount，通过 keyring 驱动）。它只提供 5.10/5.15/6.1/6.6/6.12 的
          # 预编译 .ko，4.19 一个候选都匹配不到，所以必须 built-in 集成。
          # 本子系统与 SUSFS / backslashxx KernelSU 完全解耦（不引用任何
          # ksu_/susfs_ 符号），与 SUSFS 补丁仅在 fs/Makefile 尾部追加处有交集，
          # 放在 bridge 之后是为了不与前面各步的 .rej 自检互相干扰。
          cp /tmp/Patches/Patch/hybridmount_patch_to_4.19.patch ./
          patch -p1 < hybridmount_patch_to_4.19.patch || true
          rm -f hybridmount_patch_to_4.19.patch
          # patch(1) 成功时也会留 .orig 备份，清掉以免被下面的 .rej 自检误判
          find . -name "*.orig" -delete

          # patch -p1 加了 || true，若真有 hunk 打不上这里必须报出来
          if [ -n "$(find . -name '*.rej')" ]; then
            echo "[-] hybridmount_patch has rejected hunks!"
            find . -name "*.rej" -exec cat {} \;
            false
          fi

          # 集成结果自检
          test -f fs/hybridmount/hybridmount.c || { echo "[-] fs/hybridmount/hybridmount.c missing"; false; }
          grep -qF 'obj-$(CONFIG_HYBRIDMOUNT) += hybridmount/' fs/Makefile || { echo "[-] fs/Makefile not wired"; false; }
          grep -qF 'source "fs/hybridmount/Kconfig"' fs/Kconfig || { echo "[-] fs/Kconfig not wired"; false; }
          echo "[+] Hybrid Mount VFS subsystem patched (built-in)."

      - name: ⚙️ Enable Hybrid Mount VFS in DEFCONFIG
        if: inputs.vfs_hybridmount == true
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          DEFCONFIG_PATH="./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"

          # CONFIG_KEYS=y 是 hybridmount 的硬依赖（它要 register_key_type）。
          # kona-perf_defconfig 里没有这一行，目前是靠 CONFIG_FS_ENCRYPTION=y
          # 在 fs/crypto/Kconfig 里 'select KEYS' 传递选中的。显式写出来，
          # 免得将来有人关掉 FS_ENCRYPTION 时把 keyring 一起带走。
          # 注意：只加 CONFIG_KEYS=y 不够，KEYS 还 select ASSOCIATIVE_ARRAY。
          sed -i '/^CONFIG_KEYS=/d' "$DEFCONFIG_PATH"
          sed -i '/^CONFIG_ASSOCIATIVE_ARRAY=/d' "$DEFCONFIG_PATH"
          echo "CONFIG_KEYS=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_ASSOCIATIVE_ARRAY=y" >> "$DEFCONFIG_PATH"

          # =y 而不是 =m：4.19 没有对应的预编译 .ko，内置进内核镜像才生效。
          # 先删掉可能存在的旧行，避免重复定义。
          sed -i '/^CONFIG_HYBRIDMOUNT=/d' "$DEFCONFIG_PATH"
          echo "CONFIG_HYBRIDMOUNT=y" >> "$DEFCONFIG_PATH"

          echo "[+] Appended to ${DEFCONFIG_PATH}:"
          grep -nE "CONFIG_(HYBRIDMOUNT|KEYS|ASSOCIATIVE_ARRAY)=" "$DEFCONFIG_PATH"

      - name: 🕳️ Patch NoMount VFS Subsystem
        if: inputs.vfs_nomount == true
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/

          # NoMount 与 HybridMount 是同源不同家的方案：HybridMount 的 hybridmount
          # 子系统就是从 NoMount fork 出来的，但**重命名了符号、换了自己的 wire magic**
          # （HybridMount 用 "HYBRIDMO"），因此两套元模块与工具链互不通用。
          # 二者只能选一个，构建开头的互斥校验会拦截同时开启的情况。
          #
          # NoMount 官方仓库自带 kernel/setup.sh，做的是通用内核集成
          # （把 NoMount 源码 symlink 到 fs/nomount，并往 fs/Makefile + fs/Kconfig
          #  接线），不依赖具体内核版本 —— 上游文档说明 4.19 这类 legacy 内核
          # 无法用预编译 .ko，必须源码集成，这个脚本正是干这个的。
          # 集成方式与上游 JackA1ltman/NonGKI_Kernel_Build_2nd 的 patch-nomount 一致。
          curl -sSL "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" | bash -s

          # setup.sh 的失败不一定反映到管道的退出码（curl | bash 只取 bash 的），
          # 所以这里做集成结果自检。
          test -d fs/nomount || { echo "[-] fs/nomount missing (symlink not created)"; false; }
          test -f fs/nomount/nomount.c || { echo "[-] fs/nomount/nomount.c missing"; false; }
          grep -q "nomount" fs/Makefile || { echo "[-] fs/Makefile not wired"; false; }
          grep -q "fs/nomount/Kconfig" fs/Kconfig || { echo "[-] fs/Kconfig not wired"; false; }
          echo "[+] NoMount VFS subsystem patched (built-in)."

      - name: ⚙️ Enable NoMount VFS in DEFCONFIG
        if: inputs.vfs_nomount == true
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          DEFCONFIG_PATH="./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"

          # CONFIG_KEYS / CONFIG_ASSOCIATIVE_ARRAY 同样是 NoMount 的硬依赖：
          # 它与 userspace 的 nm 二进制之间完全靠 Linux keyring 通信
          # （add_key），不依赖 /dev 节点与 ioctl。
          sed -i '/^CONFIG_KEYS=/d' "$DEFCONFIG_PATH"
          sed -i '/^CONFIG_ASSOCIATIVE_ARRAY=/d' "$DEFCONFIG_PATH"
          echo "CONFIG_KEYS=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_ASSOCIATIVE_ARRAY=y" >> "$DEFCONFIG_PATH"

          # NoMount 是 drop-in 内核子系统，同样必须 =y 内置（4.19 无预编译 .ko）。
          sed -i '/^CONFIG_NOMOUNT=/d' "$DEFCONFIG_PATH"
          echo "CONFIG_NOMOUNT=y" >> "$DEFCONFIG_PATH"

          echo "[+] Appended to ${DEFCONFIG_PATH}:"
          grep -nE "CONFIG_(NOMOUNT|KEYS|ASSOCIATIVE_ARRAY)=" "$DEFCONFIG_PATH"

      - name: 🔮 Patch ZeroMount VFS Subsystem
        if: inputs.vfs_zeromount == true
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/
          # ZeroMount 是 Enginex0/zeromount 的路径重定向子系统，与 HybridMount /
          # NoMount 完全不同源：它自带 /dev/zeromount 字符设备 + 自定义 ioctl
          # 协议（不依赖 keyring），因此 CONFIG_KEYS 不是它的依赖。
          #
          # 上游只提供 5.4/5.10/5.15/6.1/6.6/6.12 补丁，non-GKI 4.19 在其 roadmap
          # 里仍标着 Planned —— 本仓库的这份补丁是自研移植版。
          #
          # ⚠️ 补丁核心 hunk 只落在 fs/d_path.c fs/namei.c fs/proc/base.c
          # fs/proc/task_mmu.c fs/readdir.c fs/stat.c fs/statfs.c fs/xattr.c
          # fs/zeromount.c include/linux/zeromount.h。
          # 其中 readdir.c / task_mmu.c 与 SUSFS 有上下文重叠，因此本步骤必须
          # 排在 SUSFS / BakaSU hooks 之后。
          #
          # fs/Makefile 与 fs/Kconfig 不在这份补丁里 —— 那两个文件的双后端上下文
          # 锚点无法同时兼容「有 HybridMount」与「没有 HybridMount」两种树
          # （patch 的 fuzz 匹配会静默插错位置），改由下面的文本注入完成，
          # 这样 ZeroMount 才能脱离 HybridMount 独立启用。
          cp /tmp/Patches/Patch/zeromount_patch_to_4.19.patch ./
          patch -p1 < zeromount_patch_to_4.19.patch || true
          rm -f zeromount_patch_to_4.19.patch

          # patch -p1 加了 || true：真有 hunk 打不上必须立刻报出来。
          if [ -n "$(find . -name '*.rej')" ]; then
            echo "[-] zeromount_patch has rejected hunks!"
            find . -name "*.rej" -exec sh -c 'echo "--- {} ---"; cat {}' \;
            false
          fi

          # ⚠️ 光看 .rej 不够：旧的 zeromount 补丁是把 SUSFS/KSU 的整段上下文
          # 当成「要替换掉的旧代码」写的（86 删 / 46 增），应用时 0 reject
          # 却把 ksu_handle_stat 等钩子静默删掉了，最后死在 BakaSU 的
          # inline_hook_check.mk（"You lost ksu_handle_stat hook"）。
          # 所以这里必须逐符号核对「补丁后仍存在」，任何 SUSFS/KSU 钩子丢失即失败。
          # 注意：本分支是 backslashxx/KernelSU（手动钩子），符号集与
          # BakaSU/ReSukiSU 分支**不同**，不能照抄那边的清单：
          #   - 没有 ksu_handle_vfs_fstat / ksu_is_init_rc_hook_enabled
          #     （改用 ksu_handle_newfstat_ret / ksu_handle_fstat64_ret）
          #   - 没有 ksu_handle_sys_read（backslashxx 未接该钩子）
          #   - 没有 ksu_handle_setresuid（其 setresuid 走 selinux hook）
          # SUSFS 开启时才核对 SUSFS 专有符号；关闭时 susfs_sus_kstat_spoof_*
          # 本就不存在，只核对 backslashxx 手动钩子提供的核心符号。
          if [ "${{ inputs.susfs_enable }}" = "true" ]; then
            ZM_CHECKS="fs/stat.c:ksu_handle_stat \
              fs/stat.c:ksu_handle_newfstat_ret \
              fs/stat.c:ksu_handle_fstat64_ret \
              fs/stat.c:susfs_sus_kstat_spoof_generic_fillattr \
              fs/stat.c:zeromount_stat_hook \
              fs/exec.c:ksu_handle_execveat \
              fs/open.c:ksu_handle_faccessat \
              kernel/reboot.c:ksu_handle_sys_reboot"
          else
            ZM_CHECKS="fs/stat.c:ksu_handle_stat \
              fs/stat.c:ksu_handle_newfstat_ret \
              fs/stat.c:ksu_handle_fstat64_ret \
              fs/stat.c:zeromount_stat_hook \
              fs/exec.c:ksu_handle_execveat \
              fs/open.c:ksu_handle_faccessat \
              kernel/reboot.c:ksu_handle_sys_reboot"
          fi
          for chk in $ZM_CHECKS; do
            chk_file="${chk%%:*}"
            chk_sym="${chk##*:}"
            if ! grep -q "$chk_sym" "$chk_file"; then
              echo "[-] $chk_sym missing from $chk_file after ZeroMount patch!"
              echo "[-] (ZeroMount 补丁必须与 KernelSU 钩子共存，不能覆盖它们)"
              false
            fi
          done
          echo "[+] KernelSU hooks preserved alongside ZeroMount."

          # fs/Kconfig：在「最后一个 endmenu」之前插入 config 块
          ENDMENU_LINE=$(grep -n '^endmenu' fs/Kconfig | tail -1 | cut -d: -f1)
          if [ -z "$ENDMENU_LINE" ]; then
            echo "[-] fs/Kconfig has no endmenu anchor"; false
          fi
          printf '%s\n' \
            'config ZEROMOUNT' \
            '	bool "ZeroMount Path Redirection Subsystem"' \
            '	default y' \
            '	help' \
            '	  ZeroMount allows path redirection and virtual file injection' \
            '	  without mounting filesystems. Useful for systemless modifications.' \
            '' > /tmp/zm_kconfig_block.txt
          { head -n $((ENDMENU_LINE - 1)) fs/Kconfig
            cat /tmp/zm_kconfig_block.txt
            tail -n +$ENDMENU_LINE fs/Kconfig
          } > fs/Kconfig.zmnew && mv fs/Kconfig.zmnew fs/Kconfig
          rm -f /tmp/zm_kconfig_block.txt

          # fs/Makefile：末尾追加（Makefile 内部顺序无语义要求）
          grep -qF 'CONFIG_ZEROMOUNT' fs/Makefile \
            || echo 'obj-$(CONFIG_ZEROMOUNT)		+= zeromount.o' >> fs/Makefile

          # 集成结果自检
          test -f fs/zeromount.c || { echo "[-] fs/zeromount.c missing"; false; }
          test -f include/linux/zeromount.h || { echo "[-] include/linux/zeromount.h missing"; false; }
          grep -qF 'obj-$(CONFIG_ZEROMOUNT)' fs/Makefile || { echo "[-] fs/Makefile not wired"; false; }
          grep -q '^config ZEROMOUNT$' fs/Kconfig || { echo "[-] fs/Kconfig not wired"; false; }
          grep -q 'zeromount_inject_dents64' fs/readdir.c || { echo "[-] fs/readdir.c hook missing"; false; }
          grep -q 'zeromount_stat_hook' fs/stat.c || { echo "[-] fs/stat.c hook missing"; false; }
          grep -q 'zeromount_getname_hook' fs/namei.c || { echo "[-] fs/namei.c hook missing"; false; }
          grep -q 'CONFIG_KSU_SUSFS_SUS_PATH' fs/readdir.c || { echo "[-] SUSFS readdir hooks lost!"; false; }
          echo "[+] ZeroMount VFS subsystem patched (built-in, SUSFS-aware)."
      - name: ⚙️ Enable ZeroMount VFS in DEFCONFIG
        if: inputs.vfs_zeromount == true
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          DEFCONFIG_PATH="./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"

          # ZeroMount 走自己的字符设备 + ioctl，不用 keyring，所以不需要
          # CONFIG_KEYS / CONFIG_ASSOCIATIVE_ARRAY（那是 HM / NoMount 的依赖）。
          #
          # =y 而不是 =m：它 hook 的是 inode_permission / iterate_dir / vfs_getattr
          # 这些核心 VFS 路径，必须编进内核镜像，做不成模块。
          sed -i '/^CONFIG_ZEROMOUNT=/d' "$DEFCONFIG_PATH"
          echo "CONFIG_ZEROMOUNT=y" >> "$DEFCONFIG_PATH"

          echo "[+] Appended to ${DEFCONFIG_PATH}:"
          grep -nE "CONFIG_ZEROMOUNT=" "$DEFCONFIG_PATH"


      - name: 🪛 Extra Kernel Options
        run: |
          # Only ${{ env.DEVICE_NAME }} use it.
          cd $GITHUB_WORKSPACE/device_kernel

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🖼️ Generate DTB (kona + kona-v2 + kona-v2.1)
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          cat out/arch/arm64/boot/dts/vendor/oplus/kona.dtb out/arch/arm64/boot/dts/vendor/oplus/kona-v2.dtb out/arch/arm64/boot/dts/vendor/oplus/kona-v2.1.dtb > out/arch/arm64/boot/dtb.img
          echo "[+] Generated dtb.img"

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files

